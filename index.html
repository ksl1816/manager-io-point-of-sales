<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POS — Manager.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ─────────── DESIGN TOKENS ─────────── */
:root{
  --accent:#4f8cff;
  --accent-strong:#3b78ec;
  --accent-soft:rgba(79,140,255,.12);
  --accent-glow:rgba(79,140,255,.22);
  --success:#10b981;
  --success-soft:rgba(16,185,129,.12);
  --warn:#f59e0b;
  --warn-soft:rgba(245,158,11,.12);
  --danger:#ef4444;
  --danger-soft:rgba(239,68,68,.12);
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:16px;
  --radius-xl:20px;
  --tx-fast:.12s ease;
  --tx:.18s ease;
}
[data-theme="dark"]{
  --bg:#0a0d14;
  --bg-elevated:#13171f;
  --panel:#13171f;
  --panel-hover:#181d27;
  --border:#232936;
  --border-strong:#2d3441;
  --text:#e6eaf2;
  --text-mute:#8a93a6;
  --text-dim:#5a6378;
  --input-bg:#0f131c;
  --input-border:#252b39;
  --input-border-focus:var(--accent);
  --row-hover:rgba(79,140,255,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.25);
  --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  --scroll:rgba(255,255,255,.1);
  --scroll-hover:rgba(255,255,255,.18);
  --header-bg:#10141c;
}
[data-theme="light"]{
  --bg:#f6f7f9;
  --bg-elevated:#ffffff;
  --panel:#ffffff;
  --panel-hover:#fafbfd;
  --border:#e5e8ed;
  --border-strong:#d1d6df;
  --text:#0f172a;
  --text-mute:#5b6478;
  --text-dim:#94a3b8;
  --input-bg:#ffffff;
  --input-border:#d8dde5;
  --input-border-focus:var(--accent);
  --row-hover:#f5f8fe;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:0 16px 40px rgba(15,23,42,.12);
  --scroll:rgba(15,23,42,.14);
  --scroll-hover:rgba(15,23,42,.28);
  --header-bg:#fafbfd;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-feature-settings:"tnum","ss01","ss02";
  color:var(--text);
  background:var(--bg);
  min-height:100vh;
  padding:16px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.005em;
  line-height:1.45;
  font-size:14px;
}

/* ─────────── APP HEADER (identity + badges + CTA) ─────────── */
.app-header{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 18px;margin-bottom:12px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow);
}
.app-brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.app-logo{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,#4f8cff 0%,#3b78ec 100%);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 4px 12px rgba(79,140,255,.3),inset 0 1px 0 rgba(255,255,255,.18);
}
.app-title{display:flex;flex-direction:column;gap:1px;line-height:1.15}
.app-name{
  font:700 16px/1.15 'IBM Plex Sans';
  letter-spacing:-0.015em;color:var(--text);
}
.app-sub{
  font:500 11px/1 'IBM Plex Sans';
  color:var(--text-mute);letter-spacing:.01em;
}
.app-badges{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:0;
}
.app-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:99px;
  font:600 10px/1 'IBM Plex Sans';
  letter-spacing:.06em;text-transform:uppercase;
  border:1px solid;white-space:nowrap;
}
.app-badge .b-icon{width:11px;height:11px;flex-shrink:0}
.b-blue   {background:rgba(79,140,255,.1); color:#4f8cff;border-color:rgba(79,140,255,.28)}
.b-green  {background:rgba(16,185,129,.1); color:#10b981;border-color:rgba(16,185,129,.28)}
.b-purple {background:rgba(139,92,246,.1); color:#a78bfa;border-color:rgba(139,92,246,.28)}
.b-mode   {background:rgba(239,68,68,.1);  color:#ef4444;border-color:rgba(239,68,68,.28)}
.b-mode.live{background:rgba(16,185,129,.1);color:#10b981;border-color:rgba(16,185,129,.28)}
.b-dot{
  width:6px;height:6px;border-radius:50%;background:currentColor;
  box-shadow:0 0 0 3px currentColor;opacity:.85;
}
.b-mode.live .b-dot{animation:b-pulse 2s ease-in-out infinite}
@keyframes b-pulse{
  0%,100%{box-shadow:0 0 0 3px currentColor;opacity:.85}
  50%    {box-shadow:0 0 0 6px transparent;opacity:.4}
}

[data-theme="light"] .b-blue  {background:#e8f0ff;color:#1e5fcf;border-color:rgba(30,95,207,.2)}
[data-theme="light"] .b-green {background:#dcf5e7;color:#0a8447;border-color:rgba(10,132,71,.2)}
[data-theme="light"] .b-purple{background:#ece7fa;color:#6b4ee6;border-color:rgba(107,78,230,.2)}
[data-theme="light"] .b-mode  {background:#fde8e8;color:#c81e1e;border-color:rgba(200,30,30,.2)}
[data-theme="light"] .b-mode.live{background:#dcf5e7;color:#0a8447;border-color:rgba(10,132,71,.2)}

.app-cta{
  margin-left:auto;
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:99px;
  background:#fef0c0;color:#7c5410;
  border:1px solid rgba(124,84,16,.25);
  font:600 12px/1 'IBM Plex Sans';letter-spacing:.01em;
  text-decoration:none;cursor:pointer;
  transition:background var(--tx-fast),border-color var(--tx-fast),transform var(--tx-fast),box-shadow var(--tx-fast);
  white-space:nowrap;flex-shrink:0;
}
.app-cta:hover{
  background:#fce58a;border-color:rgba(124,84,16,.4);
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(124,84,16,.18);
}
[data-theme="dark"] .app-cta{
  background:rgba(245,158,11,.12);color:#fbbf24;
  border-color:rgba(245,158,11,.3);
}
[data-theme="dark"] .app-cta:hover{
  background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.5);
  box-shadow:0 4px 14px rgba(245,158,11,.25);
}
@media(max-width:720px){
  .app-cta{margin-left:0;width:100%;justify-content:center}
  .app-badges{order:3;width:100%}
}

/* ─────────── TOP BAR ─────────── */
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 16px;margin-bottom:14px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  font-weight:700;font-size:15px;letter-spacing:-0.01em;
  color:var(--text);
}
.brand-mark{
  width:28px;height:28px;border-radius:8px;
  background:var(--accent);
  display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:13px;
  box-shadow:0 0 0 1px var(--accent-strong) inset, 0 4px 10px var(--accent-glow);
  letter-spacing:0;
}
.brand-sub{font-size:11px;color:var(--text-mute);font-weight:500;letter-spacing:.02em}
.divider-v{width:1px;height:22px;background:var(--border)}

.load-btn{
  padding:8px 16px;border:none;border-radius:var(--radius-sm);
  cursor:pointer;font:600 12px/1 'IBM Plex Sans',sans-serif;
  color:#fff;background:var(--accent);
  letter-spacing:.02em;text-transform:uppercase;
  transition:background var(--tx-fast),transform var(--tx-fast);
  box-shadow:0 1px 2px rgba(0,0,0,.15),0 0 0 1px var(--accent-strong) inset;
  white-space:nowrap;
}
.load-btn:hover:not(:disabled){background:var(--accent-strong)}
.load-btn:active:not(:disabled){transform:translateY(1px)}
.load-btn:disabled{opacity:.5;cursor:not-allowed}

.progress-wrap{
  flex:1;min-width:120px;height:3px;
  background:var(--border);border-radius:99px;overflow:hidden;
}
.progress-bar{
  height:100%;width:0%;background:var(--accent);
  border-radius:99px;transition:width .3s ease;
}
.status-text{
  font:500 11px/1.2 'IBM Plex Mono',monospace;
  color:var(--text-mute);white-space:nowrap;
  max-width:340px;overflow:hidden;text-overflow:ellipsis;
}
.icon-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;cursor:pointer;
  display:grid;place-items:center;color:var(--text-mute);
  transition:all var(--tx-fast);font-size:14px;
}
.icon-btn:hover{background:var(--panel-hover);border-color:var(--border-strong);color:var(--text)}
.debug-toggle{
  font:600 10px/1 'IBM Plex Sans';color:var(--text-mute);
  background:transparent;border:1px solid var(--border);
  padding:7px 11px;border-radius:var(--radius-sm);cursor:pointer;
  text-transform:uppercase;letter-spacing:.06em;
  transition:all var(--tx-fast);
}
.debug-toggle:hover{color:var(--text);border-color:var(--border-strong)}

/* ─────────── DEBUG ─────────── */
.debug-log{
  background:#06080d;border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;
  color:#94a3b8;max-height:160px;overflow-y:auto;margin-bottom:12px;
  display:none;white-space:pre-wrap;word-break:break-all;line-height:1.5;
}
.debug-log.show{display:block}
.debug-log .ok{color:#10b981}
.debug-log .fail{color:#f87171}
.debug-log .info{color:#7da4ff}

/* ─────────── LAYOUT ─────────── */
.pos-grid{
  display:grid;grid-template-columns:1fr 420px;gap:14px;
  min-height:calc(100vh - 100px);
}
@media(max-width:980px){.pos-grid{grid-template-columns:1fr}}

.panel{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-xl);padding:20px;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow);
}
.panel-title{
  font:700 10px/1 'IBM Plex Sans';
  text-transform:uppercase;letter-spacing:.12em;
  color:var(--text-mute);margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.panel-title::before{
  content:"";width:4px;height:4px;border-radius:50%;
  background:var(--accent);
}

/* ─────────── FORM ─────────── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form-field{display:flex;flex-direction:column}
.form-field.full{grid-column:1/-1}
.form-field label{
  font:600 10px/1 'IBM Plex Sans';text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-mute);margin-bottom:6px;
}
.form-field input,.form-field textarea,.form-field select{
  background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:var(--radius-sm);padding:9px 12px;
  color:var(--text);font:500 13px/1.4 'IBM Plex Sans',sans-serif;
  transition:border-color var(--tx-fast),box-shadow var(--tx-fast);
}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.form-field input::placeholder{color:var(--text-dim);font-weight:400}

/* ─────────── BARCODE INPUT ─────────── */
.barcode-wrap{position:relative;margin-bottom:10px}
.barcode-input{
  width:100%;
  font:600 16px/1.2 'IBM Plex Mono',monospace !important;
  padding:14px 16px 14px 46px !important;
  background:var(--input-bg) !important;
  border:1.5px solid var(--input-border) !important;
  border-radius:var(--radius) !important;
  color:var(--text);
  letter-spacing:.02em;
  transition:border-color var(--tx-fast),box-shadow var(--tx-fast) !important;
}
.barcode-input:focus{
  outline:none !important;
  border-color:var(--accent) !important;
  box-shadow:0 0 0 4px var(--accent-soft) !important;
}
.barcode-input::placeholder{color:var(--text-dim);font-weight:500;letter-spacing:0;font-family:'IBM Plex Sans',sans-serif}
.barcode-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;color:var(--text-mute);pointer-events:none;
}
.scanner-status{
  display:flex;align-items:center;gap:8px;
  font:500 11px/1 'IBM Plex Sans';color:var(--text-mute);
  margin-top:8px;padding-left:2px;
}
.scanner-dot{
  width:6px;height:6px;background:var(--success);border-radius:50%;
  box-shadow:0 0 0 3px var(--success-soft);
}
.indexed-count{font-weight:600;color:var(--text);font-family:'IBM Plex Mono',monospace}

/* ─────────── STATS ─────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;
}
.stat .val{
  font:700 22px/1.1 'IBM Plex Sans';color:var(--text);
  font-variant-numeric:tabular-nums;letter-spacing:-0.02em;
}
.stat .lbl{
  font:600 10px/1 'IBM Plex Sans';text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-mute);margin-top:6px;
}
.stat.accent .val{color:var(--success)}

/* ─────────── CART TABLE ─────────── */
.cart-wrap{
  flex:1;overflow:auto;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg);
  min-height:280px;
}
.cart-table{width:100%;border-collapse:collapse;font-size:13px}
.cart-table thead{
  background:var(--header-bg);
  position:sticky;top:0;z-index:2;
}
.cart-table th{
  text-align:left;padding:10px 12px;
  font:600 10px/1 'IBM Plex Sans';text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-mute);
  border-bottom:1px solid var(--border);
}
.cart-table td{
  padding:9px 12px;border-bottom:1px solid var(--border);
  vertical-align:middle;
}
.cart-table tbody tr{transition:background var(--tx-fast)}
.cart-table tbody tr:hover{background:var(--row-hover)}
.cart-table tbody tr:last-child td{border-bottom:none}
.cart-table tbody tr.flash{animation:rowFlash .7s ease}
@keyframes rowFlash{
  0%{background:var(--accent-soft)}
  100%{background:transparent}
}

.code-cell{
  font:600 11px/1 'IBM Plex Mono',monospace;
  color:var(--text-mute);letter-spacing:.02em;
}
.name-cell{font-weight:500;color:var(--text)}

.qty-input,.price-input{
  width:74px;
  background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:6px;padding:5px 9px;
  color:var(--text);
  font:600 13px/1.2 'IBM Plex Mono',monospace;
  text-align:right;
  font-variant-numeric:tabular-nums;
  transition:border-color var(--tx-fast),box-shadow var(--tx-fast);
}
.price-input{width:90px}
.qty-input:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-soft);
}
.price-input[readonly]{
  background:transparent;color:var(--text-mute);
  cursor:not-allowed;border-color:transparent;
}

.qty-owned{
  font:600 12px/1 'IBM Plex Mono',monospace;
  text-align:right;font-variant-numeric:tabular-nums;
}
.qty-owned.ok{color:var(--success)}
.qty-owned.warn{color:var(--warn)}
.qty-owned.over{
  color:var(--danger);background:var(--danger-soft);
  border-radius:6px;padding:3px 7px;display:inline-block;
}
.qty-owned.na{color:var(--text-dim)}
tr.over-row td{background:rgba(239,68,68,.04) !important}

.line-total{
  font:600 13px/1.2 'IBM Plex Mono',monospace;
  text-align:right;color:var(--success);
  font-variant-numeric:tabular-nums;
}

.remove-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--text-mute);border-radius:6px;
  width:26px;height:26px;cursor:pointer;
  display:grid;place-items:center;
  font:600 16px/1 'IBM Plex Sans';
  transition:all var(--tx-fast);
}
.remove-btn:hover{
  background:var(--danger);color:#fff;border-color:var(--danger);
}

.empty-cart{
  text-align:center;padding:60px 20px;color:var(--text-mute);
}
.empty-cart-icon{
  width:48px;height:48px;border-radius:14px;
  background:var(--accent-soft);
  display:grid;place-items:center;margin:0 auto 14px;
  color:var(--accent);
}
.empty-cart-title{font-size:14px;color:var(--text);font-weight:600;margin-bottom:4px}
.empty-cart-sub{font-size:12px;color:var(--text-mute)}

/* ─────────── SUMMARY ─────────── */
.summary{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 18px;margin-bottom:12px;
}
.summary-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:4px 0;font-size:13px;color:var(--text-mute);font-weight:500;
}
.summary-row .v{
  font-family:'IBM Plex Mono',monospace;font-weight:600;
  color:var(--text);font-variant-numeric:tabular-nums;
}
.summary-row.grand{
  border-top:1px solid var(--border);margin-top:10px;padding-top:12px;
}
.summary-row.grand .l{
  font:700 11px/1 'IBM Plex Sans';text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-mute);
}
.summary-row.grand .v{
  font:700 26px/1 'IBM Plex Sans';
  color:var(--success);letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
}

/* ─────────── ACTIONS ─────────── */
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.btn{
  padding:13px 18px;border:none;border-radius:var(--radius);
  font:700 12px/1 'IBM Plex Sans';cursor:pointer;
  text-transform:uppercase;letter-spacing:.06em;
  transition:background var(--tx-fast),transform var(--tx-fast),opacity var(--tx-fast);
}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{
  background:var(--accent);color:#fff;
  box-shadow:0 0 0 1px var(--accent-strong) inset, 0 2px 8px var(--accent-glow);
}
.btn-primary:hover:not(:disabled){background:var(--accent-strong)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{
  background:transparent;color:var(--text-mute);
  border:1px solid var(--border);
}
.btn-secondary:hover{
  background:var(--panel-hover);color:var(--text);
  border-color:var(--border-strong);
}

/* ─────────── TOAST ─────────── */
.toast{
  position:fixed;top:18px;right:18px;
  padding:12px 16px;border-radius:var(--radius);
  font:600 13px/1.4 'IBM Plex Sans';z-index:9999;
  animation:toastIn .25s ease;max-width:420px;
  box-shadow:var(--shadow-lg);
  border:1px solid;display:flex;align-items:center;gap:10px;
}
.toast.success{background:var(--success-soft);color:var(--success);border-color:rgba(16,185,129,.3)}
.toast.error{background:var(--danger-soft);color:var(--danger);border-color:rgba(239,68,68,.3)}
.toast.info{background:var(--accent-soft);color:var(--accent);border-color:rgba(79,140,255,.3)}
[data-theme="dark"] .toast{
  background:var(--panel);
}
[data-theme="dark"] .toast.success{color:#34d399;border-color:rgba(16,185,129,.4)}
[data-theme="dark"] .toast.error{color:#fca5a5;border-color:rgba(239,68,68,.4)}
[data-theme="dark"] .toast.info{color:#93b8ff;border-color:rgba(79,140,255,.4)}
@keyframes toastIn{
  from{transform:translateX(20px);opacity:0}
  to{transform:translateX(0);opacity:1}
}

/* ─────────── CUSTOMER BADGE ─────────── */
.customer-display{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.customer-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px;background:var(--accent-soft);
  border:1px solid rgba(79,140,255,.25);
  border-radius:99px;font-size:12px;font-weight:600;color:var(--accent);
}
.customer-badge .dot{
  width:5px;height:5px;border-radius:50%;background:var(--accent);
}
.clear-link{
  font:600 11px/1 'IBM Plex Sans';color:var(--text-mute);
  cursor:pointer;text-decoration:none;
}
.clear-link:hover{color:var(--danger);text-decoration:underline}

/* ─────────── SUGGEST ─────────── */
.suggest-wrap{position:relative}
.suggest-list{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:var(--bg-elevated);border:1px solid var(--border-strong);

<script>
/* ══════════════════════════════════════════════════════
   Capture managerAppContext from parent
══════════════════════════════════════════════════════ */
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'manager-context' && event.data.payload) {
    window.managerAppContext = event.data.payload;
    debugLog('info', '✓ managerAppContext received: ' +
      (window.managerAppContext.apiEndpoint || '(no apiEndpoint)'));
    setLiveBadge();
  }
});

function setLiveBadge() {
  const badge = document.getElementById('mode-badge');
  const label = document.getElementById('mode-label');
  if (badge && label) {
    badge.classList.add('live');
    label.textContent = 'Live · Connected';
  }
}

// In case parent posted context before this script attached, check on load.
if (window.managerAppContext) setLiveBadge();

function toggleDebug() {
  document.getElementById('debug-log').classList.toggle('show');
}
function debugLog(type, msg) {
  const el = document.getElementById('debug-log');
  if (!el) return;
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = type;
  line.textContent = `[${time}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

/* ══════════════════════════════════════════════════════
   postMessage helper — DO NOT MODIFY
══════════════════════════════════════════════════════ */
function postMessageWithResponse(message, timeoutMs = 30000) {
  return new Promise((resolve, reject) => {
    const requestId = crypto.randomUUID();
    const timer = setTimeout(() => {
      window.removeEventListener('message', handler);
      reject(new Error(`Timeout after ${Math.round(timeoutMs/1000)}s — server taking too long`));
    }, timeoutMs);
    function handler(event) {
      if (event.data?.type?.endsWith('-response') && event.data?.requestId === requestId) {
        clearTimeout(timer);
        window.removeEventListener('message', handler);
        if (event.data.error) {
          reject(new Error(event.data.error));
        } else {
          resolve(event.data.body);
        }
      }
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ ...message, requestId }, '*');
  });
}

/* ══════════════════════════════════════════════════════
   Direct fetch via managerAppContext
══════════════════════════════════════════════════════ */
async function directFetch(method, path, body) {
  const ctx = window.managerAppContext;
  if (!ctx || !ctx.apiEndpoint) throw new Error('managerAppContext not available');
  let url;
  if (path.startsWith('http')) {
    url = path;
  } else {
    const base = ctx.apiEndpoint.replace(/\/+$/, '');
    url = base + (path.startsWith('/') ? path : '/' + path);
  }
  const opts = {
    method,
    headers: {
      'Authorization': 'Bearer ' + ctx.apiAccessToken,
      'Content-Type': 'application/json',
      'Accept': 'application/json',
    },
  };
  if (body !== undefined && body !== null) {
    opts.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  debugLog('info', `→ ${method} ${url}`);
  const resp = await fetch(url, opts);
  const text = await resp.text();
  debugLog(resp.ok ? 'ok' : 'fail',
    `← ${resp.status} ${resp.statusText} · ${text.substring(0, 160)}`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${text.substring(0, 200)}`);
  try { return JSON.parse(text); } catch { return text; }
}

async function apiCall(method, path, body) {
  // postMessage only — never directFetch for writes (would cause duplicates).
  const msg = { type: 'api-request', method, path };
  if (body !== undefined && body !== null) msg.body = body;
  const result = await postMessageWithResponse(msg);
  debugLog('ok', `postMessage ${method} ${path} succeeded`);
  return result;
}

/* ══════════════════════════════════════════════════════
   Paginated batch fetch  —  resilient version
   FIX: never use spread (`...page`) on a large array — it
   blows up at ~100k args with "Maximum call stack size
   exceeded". Use a plain index loop instead.
   FIX: per-page timeout is generous (3 min) and each page
   retries up to 2 times with backoff so a slow sales-invoice
   batch doesn't silently return [] and ruin stock totals.
══════════════════════════════════════════════════════ */
const BATCH_PAGE_SIZE   = 2000;     // smaller pages = faster per call, more reliable
const BATCH_TIMEOUT_MS  = 180000;   // 3 minutes per page
const BATCH_RETRIES     = 2;        // 3 attempts total per page

async function fetchOnePage(canDirect, path) {
  let lastErr;
  for (let attempt = 0; attempt <= BATCH_RETRIES; attempt++) {
    try {
      return canDirect
        ? await directFetch('GET', path)
        : await postMessageWithResponse(
            { type: 'api-request', method: 'GET', path },
            BATCH_TIMEOUT_MS
          );
    } catch (e) {
      lastErr = e;
      if (attempt < BATCH_RETRIES) {
        const wait = 1500 * (attempt + 1);
        debugLog('info', `↻ retry ${attempt+1}/${BATCH_RETRIES} for ${path} in ${wait}ms · ${e.message.substring(0,80)}`);
        await new Promise(r => setTimeout(r, wait));
      }
    }
  }
  throw lastErr;
}

async function getBatchEndpoint(endpointPath, onProgress) {
  const allItems = [];
  let nextToken     = null;
  let pageNum       = 0;
  let apiTotal      = null;
  let useSkip       = false;   // fallback to offset-based when no token returned
  let lastFirstKey  = null;    // detect "same page returned twice" infinite loops

  // For read-only GETs, prefer directFetch when we have a context — it skips
  // the postMessage relay and is much faster on large paginated datasets.
  const canDirect = !!(window.managerAppContext?.apiEndpoint);

  while (true) {
    let path;
    if (useSkip) {
      // Offset-based pagination — Manager.io accepts Skip= for batch endpoints
      path = endpointPath + '?PageSize=' + BATCH_PAGE_SIZE + '&Skip=' + allItems.length;
    } else if (nextToken) {
      path = endpointPath + '?PageSize=' + BATCH_PAGE_SIZE
           + '&next_page_token=' + encodeURIComponent(nextToken)
           + '&NextPageToken='   + encodeURIComponent(nextToken);  // hedge: try both casings
    } else {
      path = endpointPath + '?PageSize=' + BATCH_PAGE_SIZE;
    }

    const data = await fetchOnePage(canDirect, path);

    // Tolerant items-array extraction — try every field name we've seen.
    let page;
    if (Array.isArray(data))                   page = data;
    else if (Array.isArray(data.items))        page = data.items;
    else if (Array.isArray(data.Items))        page = data.Items;
    else if (Array.isArray(data.results))      page = data.results;
    else if (Array.isArray(data.records))      page = data.records;
    else if (Array.isArray(data.data))         page = data.data;
    else                                        page = [];

    // First-page diagnostic — log all top-level keys so we can see what
    // pagination fields the API actually exposes (only logs once per source).
    if (pageNum === 0 && !Array.isArray(data)) {
      const keys = Object.keys(data).slice(0, 14);
      debugLog('info', `${endpointPath} first-page keys: {${keys.join(', ')}}`);
    }

    if (page.length === 0) break;

    // Detect stuck loops — if the API ignores both our token AND our Skip,
    // we'd otherwise re-fetch the same page forever.
    const firstKey = page[0]?.key || page[0]?.Key || null;
    if (firstKey && firstKey === lastFirstKey) {
      debugLog('fail', `${endpointPath}: pagination not advancing (same first key '${firstKey}'). Stopping at ${allItems.length}.`);
      break;
    }
    lastFirstKey = firstKey;

    // SAFE append — index loop instead of spread, so 100k+ rows never crash.
    for (let i = 0; i < page.length; i++) allItems.push(page[i]);

    if (apiTotal === null) {
      apiTotal = data.totalCount ?? data.total ?? data.count
        ?? data.TotalCount ?? data.Total ?? data.Count
        ?? data._metadata?.totalCount ?? null;
    }

    pageNum++;
    if (onProgress) onProgress(allItems.length, apiTotal, pageNum);

    // Decide how to fetch the next page.
    const newToken = data.next_page_token || data.nextPageToken
      || data.NextPageToken || data.nextPage
      || data._links?.next?.href || null;

    if (newToken) {
      nextToken = newToken;
      useSkip = false; // tokens work, prefer them
    } else if (page.length >= BATCH_PAGE_SIZE) {
      // Page came back FULL but server didn't give us a token —
      // switch to Skip/offset pagination so we keep going.
      if (!useSkip) {
        debugLog('info', `${endpointPath}: no next_page_token but page is full · switching to Skip-based pagination at offset ${allItems.length}`);
        useSkip = true;
      }
      nextToken = null;
    } else {
      // Page wasn't full and no token — we're done.
      break;
    }

    // Stop if we know the total and we've reached it.
    if (apiTotal !== null && allItems.length >= apiTotal) break;

    // Hard cap: 5000 pages × 2000 = 10M records.
    if (pageNum >= 5000) break;
  }

  return allItems;
}

async function getBatchInventoryItem(onProgress) {
  return getBatchEndpoint('/api4/inventory-item-batch', onProgress);
}

/* ══════════════════════════════════════════════════════
   Yield to UI between heavy chunks (so the page doesn't
   freeze when summing 100k+ transaction lines).
══════════════════════════════════════════════════════ */
const yieldToUI = () => new Promise(r => setTimeout(r, 0));

async function chunkProcess(arr, fn, chunkSize = 5000) {
  const len = arr.length;
  for (let i = 0; i < len; i += chunkSize) {
    const end = Math.min(i + chunkSize, len);
    for (let j = i; j < end; j++) fn(arr[j]);
    if (end < len) await yieldToUI();
  }
}

/* ══════════════════════════════════════════════════════
   Compute qty owned per inventory item key.
   Uses INTEGER accumulator (qty × 1e6) to avoid IEEE-754
   drift when adding 100k+ floating-point quantities.
   Sources:
     + Starting balances    (rec.item.qtyOnHandLines[].qtyOnHand)
     + Purchase invoices    (rec.item.lines[].qty)
     − Debit notes          (returns to supplier)
     − Sales invoices       (rec.item.lines[].qty)
     + Credit notes         (returns from customer)
     − Inventory write-offs (rec.item.items[].qty)
══════════════════════════════════════════════════════ */
const SCALE = 1e6;

async function computeQtyOwned(onProgress) {
  const errors = [];

  // ── Sequential fetch with per-page progress ─────────────────────────
  // Why sequential? The parent frame serializes postMessage requests
  // anyway, so parallel just means later requests sit in a queue burning
  // their timeout clock while earlier ones run. Sequential = predictable
  // progress + each fetch gets the full timeout window for itself.
  const fetchSource = async (path, label) => {
    onProgress && onProgress(`${label} · fetching…`);
    try {
      const data = await getBatchEndpoint(path, (loaded, total, page) => {
        const totalStr = total
          ? `${loaded.toLocaleString()} / ${total.toLocaleString()}`
          : `${loaded.toLocaleString()} loaded`;
        onProgress && onProgress(`${label} · page ${page} · ${totalStr}`);
      });
      debugLog('ok', `${label}: ${data.length.toLocaleString()} records`);
      return data;
    } catch (e) {
      debugLog('fail', `${label} fetch failed: ${e.message}`);
      errors.push(`${label}: ${e.message}`);
      return [];
    }
  };

  const startingBalances = await fetchSource('/api4/inventory-item-starting-balance-batch', 'Starting balances');
  const purchaseInvoices = await fetchSource('/api4/purchase-invoice-batch',                'Purchase invoices');
  const debitNotes       = await fetchSource('/api4/debit-note-batch',                      'Debit notes');
  const salesInvoices    = await fetchSource('/api4/sales-invoice-batch',                   'Sales invoices');
  const creditNotes      = await fetchSource('/api4/credit-note-batch',                     'Credit notes');
  const writeOffs        = await fetchSource('/api4/inventory-write-off-batch',             'Write-offs');

  debugLog('info',
    `Stock sources — starting:${startingBalances.length} ` +
    `purchases:${purchaseInvoices.length} debitNotes:${debitNotes.length} ` +
    `sales:${salesInvoices.length} creditNotes:${creditNotes.length} writeOffs:${writeOffs.length}`
  );

  // Integer accumulator — no float drift.
  const microMap = Object.create(null);
  const addMicro = (k, qty) => {
    if (!k) return;
    const n = Number(qty);
    if (!n) return; // skip 0 / NaN / null
    microMap[k] = (microMap[k] || 0) + Math.round(n * SCALE);
  };
  const subMicro = (k, qty) => {
    if (!k) return;
    const n = Number(qty);
    if (!n) return;
    microMap[k] = (microMap[k] || 0) - Math.round(n * SCALE);
  };

  // ── 1. Starting balances ──
  onProgress && onProgress(`Computing stock · starting balances (${startingBalances.length.toLocaleString()})…`);
  await chunkProcess(startingBalances, rec => {
    const d = rec.item || rec;
    const itemKey = d.inventoryItem || null;
    const lines = d.qtyOnHandLines || [];
    if (lines.length > 0) {
      for (let i = 0; i < lines.length; i++) addMicro(itemKey, lines[i].qtyOnHand);
    } else {
      addMicro(itemKey, d.qtyOwned ?? 0);
    }
  });

  // ── 2. Purchase invoices (IN) ──
  onProgress && onProgress(`Computing stock · purchase invoices (${purchaseInvoices.length.toLocaleString()})…`);
  await chunkProcess(purchaseInvoices, rec => {
    const lines = rec.item?.lines;
    if (!lines) return;
    for (let i = 0; i < lines.length; i++) {
      const ln = lines[i];
      if (ln.item) addMicro(ln.item, ln.qty);
    }
  });

  // ── 3. Debit notes (OUT) ──
  onProgress && onProgress(`Computing stock · debit notes (${debitNotes.length.toLocaleString()})…`);
  await chunkProcess(debitNotes, rec => {
    const lines = rec.item?.lines;
    if (!lines) return;
    for (let i = 0; i < lines.length; i++) {
      const ln = lines[i];
      if (ln.item) subMicro(ln.item, ln.qty);
    }
  });

  // ── 4. Sales invoices (OUT) ──
  onProgress && onProgress(`Computing stock · sales invoices (${salesInvoices.length.toLocaleString()})…`);
  await chunkProcess(salesInvoices, rec => {
    const lines = rec.item?.lines;
    if (!lines) return;
    for (let i = 0; i < lines.length; i++) {
      const ln = lines[i];
      if (ln.item) subMicro(ln.item, ln.qty);
    }
  });

  // ── 5. Credit notes (IN) ──
  onProgress && onProgress(`Computing stock · credit notes (${creditNotes.length.toLocaleString()})…`);
  await chunkProcess(creditNotes, rec => {
    const lines = rec.item?.lines;
    if (!lines) return;
    for (let i = 0; i < lines.length; i++) {
      const ln = lines[i];
      if (ln.item) addMicro(ln.item, ln.qty);
    }
  });

  // ── 6. Write-offs (OUT) ──
  onProgress && onProgress(`Computing stock · write-offs (${writeOffs.length.toLocaleString()})…`);
  await chunkProcess(writeOffs, rec => {
    const items = rec.item?.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      const e = items[i];
      if (e.inventoryItem) subMicro(e.inventoryItem, e.qty);
    }
  });

  // Convert integer accumulator back to floats.
  const qtyMap = Object.create(null);
  for (const k in microMap) qtyMap[k] = microMap[k] / SCALE;

  debugLog('ok', `qtyOwned computed for ${Object.keys(qtyMap).length.toLocaleString()} unique items`);

  return { qtyMap, errors };
}

/* ══════════════════════════════════════════════════════
   State
══════════════════════════════════════════════════════ */
const state = {
  items: [],
  customers: [],
  cart: [],
  selectedCustomer: null,
  reference: '',
  qtyOwned: Object.create(null),

  // Search indexes — built once after load for fast lookup.
  itemIndex: [],            // [{rec, key, codeLower, nameLower}, ...]
  itemByCodeExact: new Map(), // codeLower -> rec  (O(1) scanner lookup)
};

/* ══════════════════════════════════════════════════════
   Build search indexes after items load.
══════════════════════════════════════════════════════ */
function buildItemIndexes() {
  const items = state.items;
  const idx = new Array(items.length);
  const exact = new Map();
  for (let i = 0; i < items.length; i++) {
    const r = items[i];
    const it = r.item || {};
    const codeLower = (it.itemCode || '').toLowerCase();
    const nameLower = (it.itemName || '').toLowerCase();
    idx[i] = { rec: r, key: r.key, codeLower, nameLower };
    if (codeLower) exact.set(codeLower, r);
  }
  state.itemIndex = idx;
  state.itemByCodeExact = exact;
  debugLog('ok', `Indexed ${items.length.toLocaleString()} items for fast search`);
}

/* ══════════════════════════════════════════════════════
   Auto-generate unique reference — POS-YYMMDD-HHMMSS
══════════════════════════════════════════════════════ */
function generateReference() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `POS-${pad(d.getFullYear()%100)}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

/* ══════════════════════════════════════════════════════
   Load
══════════════════════════════════════════════════════ */
async function loadAllRecords() {
  const btn    = document.getElementById('load-btn');
  const bar    = document.getElementById('prog-bar');
  const status = document.getElementById('status-text');
  const app    = document.getElementById('app');

  btn.disabled = true;
  btn.textContent = 'Loading…';
  bar.style.width = '0%';
  app.innerHTML = '';

  try {
    status.textContent = 'Fetching items & customers in parallel…';
    bar.style.width = '5%';

    let itemsDone = false, custsDone = false;
    const updateParallelStatus = (label, loaded, total) => {
      status.textContent = total
        ? `${label} · ${loaded.toLocaleString()}/${total.toLocaleString()}${itemsDone?' · items ✓':''}${custsDone?' · customers ✓':''}`
        : `${label} · ${loaded.toLocaleString()} loaded…`;
    };

    const [items, customers] = await Promise.all([
      getBatchInventoryItem((loaded, total, page) => {
        updateParallelStatus(`Items · pg ${page}`, loaded, total);
        if (total) bar.style.width = Math.min(20, Math.round(loaded/total*20)) + '%';
      }).then(r => { itemsDone = true; return r; }),
      getBatchEndpoint('/api4/customer-batch', (loaded, total, page) => {
        updateParallelStatus(`Customers · pg ${page}`, loaded, total);
      }).then(r => { custsDone = true; return r; }),
    ]);

    state.items = items;
    state.customers = customers;

    // Build search indexes once — this is the key perf fix for 100k+ items.
    status.textContent = `Indexing ${items.length.toLocaleString()} items…`;
    bar.style.width = '38%';
    await yieldToUI();
    buildItemIndexes();

    // Compute qty owned (chunked + integer accumulator)
    bar.style.width = '50%';
    const { qtyMap, errors } = await computeQtyOwned(msg => { status.textContent = msg; });
    state.qtyOwned = qtyMap;
    bar.style.width = '100%';

    const ownedCount = Object.keys(qtyMap).length;
    if (errors.length) {
      status.textContent = `⚠ ${errors.length} source(s) failed — stock may be inaccurate · ${items.length.toLocaleString()} items · ${customers.length.toLocaleString()} customers`;
    } else {
      status.textContent = `✓ ${items.length.toLocaleString()} items · ${customers.length.toLocaleString()} customers · stock for ${ownedCount.toLocaleString()}`;
    }
    btn.textContent = '↻ Reload';
    btn.disabled = false;

    // Default 999/POS customer
    const def = getDefaultCustomer();
    if (def) {
      state.selectedCustomer = {
        key: def.key,
        name: def.item?.name || 'POS',
        code: def.item?.code || '999',
      };
    }
    state.reference = generateReference();

    render();

    // Surface any partial-fetch errors so user knows totals may be off
    if (errors.length) {
      const banner = document.createElement('div');
      banner.className = 'warning-banner';
      banner.innerHTML = `<strong>⚠ Stock totals may be inaccurate.</strong> ${errors.length} of 6 stock source(s) failed to load. Press <strong>↻ Reload</strong> to retry — slow endpoints are retried automatically up to 3 times per page.<br><small style="opacity:.8;display:block;margin-top:6px">${errors.map(e => escapeHtml(e)).join(' · ')}</small>`;
      app.insertBefore(banner, app.firstChild);
    }

  } catch (err) {
    status.textContent = '⚠ ' + err.message;
    btn.textContent = '↻ Retry';
    btn.disabled = false;
    app.innerHTML = `<div class="error-box">⚠ ${err.message}<br><small>Make sure this extension is running inside Manager.io</small></div>`;
  }
}

/* ══════════════════════════════════════════════════════
   Helpers
══════════════════════════════════════════════════════ */
const fmt = v => (Number(v) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtQty = v => (Number(v) || 0).toLocaleString(undefined, { maximumFractionDigits: 4 });
const todayISO = () => new Date().toISOString().slice(0, 10);

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

/* O(1) exact-code lookup → fallback to single-pass partial match. */
function findItemByBarcode(code) {
  if (!code) return null;
  const needle = code.trim().toLowerCase();
  if (!needle) return null;

  const exact = state.itemByCodeExact.get(needle);
  if (exact) return exact;

  // Single pass for prefix / name match — early exit on first hit.
  const idx = state.itemIndex;
  for (let i = 0; i < idx.length; i++) {
    if (idx[i].codeLower.startsWith(needle) && needle.length >= 2) return idx[i].rec;
  }
  for (let i = 0; i < idx.length; i++) {
    if (idx[i].nameLower === needle) return idx[i].rec;
  }
  return null;
}

function getDefaultCustomer() {
  return state.customers.find(c =>
    (c.item?.code || '').trim() === '999' ||
    (c.item?.code || '').toLowerCase().includes('pos') ||
    (c.item?.name || '').toLowerCase() === 'pos'
  );
}

/* ══════════════════════════════════════════════════════
   FAST search — single pass, early termination, ranked.
══════════════════════════════════════════════════════ */
function searchItems(needle, limit = 12) {
  needle = needle.toLowerCase();
  if (!needle) return [];
  const idx = state.itemIndex;
  const out = [];
  const seen = new Set();

  // Tier 1: exact code (single map lookup)
  const ex = state.itemByCodeExact.get(needle);
  if (ex) { out.push(ex); seen.add(ex.key); }

  // Tier 2: code starts-with  (single pass, early exit)
  for (let i = 0; i < idx.length && out.length < limit; i++) {
    const e = idx[i];
    if (!seen.has(e.key) && e.codeLower && e.codeLower.startsWith(needle)) {
      out.push(e.rec); seen.add(e.key);
    }
  }
  if (out.length >= limit) return out;

  // Tier 3: name contains  (single pass, early exit)
  for (let i = 0; i < idx.length && out.length < limit; i++) {
    const e = idx[i];
    if (!seen.has(e.key) && e.nameLower && e.nameLower.includes(needle)) {
      out.push(e.rec); seen.add(e.key);
    }
  }
  return out;
}

/* ══════════════════════════════════════════════════════
   Cart  —  incremental DOM updates (no full re-render)
══════════════════════════════════════════════════════ */
function addItemToCartByRecord(rec) {
  if (!rec) return false;
  const key = rec.key;
  const existing = state.cart.find(l => l.key === key);
  if (existing) {
    existing.qty = (Number(existing.qty) || 0) + 1;
    updateCartRowDOM(existing, true);
  } else {
    const line = {
      key,
      itemCode: rec.item?.itemCode || '',
      itemName: rec.item?.itemName || 'Item',
      qty: rec.item?.hasDefaultQty && rec.item?.defaultQty ? rec.item.defaultQty : 1,
      unitPrice: rec.item?.hasDefaultSalesUnitPrice ? (rec.item.defaultSalesUnitPrice || 0) : 0,
      description: rec.item?.hasDefaultLineDescription ? (rec.item.defaultLineDescription || '') : '',
      qtyOwned: (state.qtyOwned && key in state.qtyOwned) ? state.qtyOwned[key] : null,
    };
    state.cart.push(line);
    appendCartRow(line);
  }
  renderSummary();
  return true;
}

function addItemToCart(barcode) {
  const rec = findItemByBarcode(barcode);
  if (!rec) {
    toast(`No item matches "${barcode}"`, 'error');
    return false;
  }
  return addItemToCartByRecord(rec);
}

function updateCartQty(key, qty) {
  const line = state.cart.find(l => l.key === key);
  if (!line) return;
  const n = Number(qty);
  line.qty = isNaN(n) || n < 0 ? 0 : n;
  updateCartRowDOM(line, false);
  renderSummary();
}

function updateCartPrice(key, price) {
  const line = state.cart.find(l => l.key === key);
  if (!line) return;
  const n = Number(price);
  line.unitPrice = isNaN(n) || n < 0 ? 0 : n;
  updateCartRowDOM(line, false);
  renderSummary();
}

function removeFromCart(key) {
  state.cart = state.cart.filter(l => l.key !== key);
  const row = document.querySelector(`tr[data-key="${cssEscape(key)}"]`);
  if (row) row.remove();
  if (state.cart.length === 0) renderEmptyCart();
  renderSummary();
}

function clearCart() {
  if (state.cart.length === 0) return;
  if (!confirm('Clear all items from the current sale?')) return;
  state.cart = [];
  renderEmptyCart();
  renderSummary();
}

/* CSS.escape polyfill-lite (UUIDs only contain - and hex, but be safe) */
function cssEscape(s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c); }

/* ══════════════════════════════════════════════════════
   Submit sale
══════════════════════════════════════════════════════ */
let isSubmitting = false;

async function submitSale() {
  if (isSubmitting) {
    debugLog('fail', '⚠ Submit already in progress — ignoring duplicate click');
    return;
  }

  if (state.cart.length === 0) {
    toast('Cart is empty — scan items first', 'error');
    return;
  }

  // Stock validation
  const overStockLines = state.cart.filter(l => {
    const owned = l.qtyOwned;
    return owned !== null && (Number(l.qty) || 0) > owned;
  });
  if (overStockLines.length > 0) {
    const names = overStockLines.map(l => `"${l.itemName}" (selling ${l.qty}, owned ${l.qtyOwned})`).join(', ');
    toast(`⚠ Cannot complete sale — quantity exceeds stock for: ${names}`, 'error');
    debugLog('fail', `Stock overrun blocked: ${names}`);
    return;
  }

  let customer = state.selectedCustomer;
  if (!customer) {
    const def = getDefaultCustomer();
    if (def) customer = { key: def.key, name: def.item?.name || 'POS', code: def.item?.code || '999' };
  }
  if (!customer) {
    toast('No customer with code "999" or "POS" found. Please create one in Manager.', 'error');
    return;
  }

  isSubmitting = true;

  const issueDate = document.getElementById('issue-date').value || todayISO();
  const custName  = document.getElementById('cust-name-free').value.trim();
  const custPhone = document.getElementById('cust-phone').value.trim();

  let description = '';
  if (custName || custPhone) {
    const bits = [];
    if (custName)  bits.push('Name: '  + custName);
    if (custPhone) bits.push('Phone: ' + custPhone);
    description = bits.join(' · ');
  }

  const reference = state.reference || generateReference();

  const payload = {
    issueDate: issueDate + 'T00:00:00',
    reference: reference,
    customer: customer.key,
    description: description || null,
    lines: state.cart.map(l => ({
      item: l.key,
      lineDescription: l.description || '',
      qty: Number(l.qty) || 0,
      salesUnitPrice: Number(l.unitPrice) || 0,
    })),
  };

  // Single UUID reused across attempts — makes PUTs idempotent.
  const newKey = crypto.randomUUID();
  const attempts = [
    { method: 'PUT', path: `/api4/sales-invoice-form/${newKey}`, body: payload, label: 'PUT /api4/sales-invoice-form/{uuid}' },
    { method: 'PUT', path: `/api4/sales-invoice/${newKey}`,      body: payload, label: 'PUT /api4/sales-invoice/{uuid}' },
  ];

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Processing…';

  debugLog('info', `═══ Submit · ref ${reference} · uuid ${newKey} ═══`);

  let lastErr = null, success = false;
  for (const attempt of attempts) {
    try {
      debugLog('info', `Trying: ${attempt.label}`);
      await apiCall(attempt.method, attempt.path, attempt.body);
      success = true;
      debugLog('ok', `✓ SUCCESS via ${attempt.label}`);
      break;
    } catch (err) {
      lastErr = err;
      debugLog('fail', `✗ ${attempt.label} → ${err.message.substring(0, 140)}`);
    }
  }

  btn.disabled = false;
  btn.textContent = 'Complete Sale';
  isSubmitting = false;

  if (success) {
    toast(`✓ Sale saved · ${reference} · ${fmt(cartTotal())}`, 'success');

    // Update local stock levels
    for (const line of state.cart) {
      const sold = Number(line.qty) || 0;
      if (line.key && line.key in state.qtyOwned) {
        state.qtyOwned[line.key] = (state.qtyOwned[line.key] || 0) - sold;
      }
    }

    // Reset
    state.cart = [];
    const def = getDefaultCustomer();
    state.selectedCustomer = def ? {
      key: def.key, name: def.item?.name || 'POS', code: def.item?.code || '999',
    } : null;
    state.reference = generateReference();

    document.getElementById('cust-name-free').value = '';
    document.getElementById('cust-phone').value = '';
    document.getElementById('cust-search').value = '';
    document.getElementById('issue-date').value = todayISO();
    renderEmptyCart();
    renderSummary();
    renderCustomerField();
    renderReference();
    document.getElementById('barcode').focus();
  } else {
    const msg = lastErr ? lastErr.message : 'Unknown error';
    toast(`Failed to save sale. ${msg.substring(0, 200)}. Check Debug panel.`, 'error');
    document.getElementById('debug-log').classList.add('show');
  }
}

/* ══════════════════════════════════════════════════════
   Totals
══════════════════════════════════════════════════════ */
function cartTotal() {
  let s = 0;
  for (let i = 0; i < state.cart.length; i++) {
    const l = state.cart[i];
    s += (Number(l.qty) || 0) * (Number(l.unitPrice) || 0);
  }
  return s;
}
function cartQty() {
  let s = 0;
  for (let i = 0; i < state.cart.length; i++) s += (Number(state.cart[i].qty) || 0);
  return s;
}

/* ══════════════════════════════════════════════════════
   Cart rendering — incremental
══════════════════════════════════════════════════════ */
function renderEmptyCart() {
  const wrap = document.getElementById('cart-wrap');
  if (!wrap) return;
  wrap.innerHTML = `
    <div class="empty-cart">
      <div class="empty-cart-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
      </div>
      <div class="empty-cart-title">Ready for your first scan</div>
      <div class="empty-cart-sub">Items will appear here as they're added</div>
    </div>
  `;
}

function ensureCartTable() {
  let wrap = document.getElementById('cart-wrap');
  if (!wrap) return null;
  let tbody = wrap.querySelector('tbody');
  if (!tbody) {
    wrap.innerHTML = `
      <table class="cart-table">
        <thead>
          <tr>
            <th style="width:90px">Code</th>
            <th>Item</th>
            <th style="width:80px;text-align:right">Owned</th>
            <th style="width:90px;text-align:right">Qty</th>
            <th style="width:104px;text-align:right">Price</th>
            <th style="width:104px;text-align:right">Total</th>
            <th style="width:46px"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    `;
    tbody = wrap.querySelector('tbody');
  }
  return tbody;
}

function rowHTML(line) {
  const lineTotal = (Number(line.qty) || 0) * (Number(line.unitPrice) || 0);
  const owned = line.qtyOwned;
  const qty = Number(line.qty) || 0;
  const isOver = owned !== null && qty > owned;
  const isWarn = owned !== null && qty === owned && qty > 0;
  let ownedCls = 'na', ownedLbl = '—';
  if (owned !== null) {
    ownedLbl = fmtQty(owned);
    ownedCls = isOver ? 'over' : isWarn ? 'warn' : 'ok';
  }
  const trCls = isOver ? 'over-row' : '';
  const k = escapeHtml(line.key);
  return `
    <tr data-key="${k}" class="${trCls}">
      <td class="code-cell">${escapeHtml(line.itemCode || '—')}</td>
      <td class="name-cell">${escapeHtml(line.itemName)}</td>
      <td style="text-align:right"><span class="qty-owned ${ownedCls}">${ownedLbl}</span></td>
      <td style="text-align:right">
        <input type="number" class="qty-input" value="${line.qty}" min="0" step="any"
               onchange="updateCartQty('${k}', this.value)" />
      </td>
      <td style="text-align:right">
        <input type="number" class="price-input" value="${line.unitPrice}" readonly
               title="Selling price is fixed" />
      </td>
      <td class="line-total">${fmt(lineTotal)}</td>
      <td style="text-align:center">
        <button class="remove-btn" onclick="removeFromCart('${k}')" title="Remove">×</button>
      </td>
    </tr>
  `;
}

function appendCartRow(line) {
  const tbody = ensureCartTable();
  if (!tbody) return;
  const tmp = document.createElement('tbody');
  tmp.innerHTML = rowHTML(line);
  const newRow = tmp.firstElementChild;
  newRow.classList.add('flash');
  tbody.appendChild(newRow);
  // Scroll into view
  const wrap = document.getElementById('cart-wrap');
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function updateCartRowDOM(line, isIncrement) {
  const row = document.querySelector(`tr[data-key="${cssEscape(line.key)}"]`);
  if (!row) {
    // Row missing — fallback to append (e.g. empty-cart was rendered)
    if (state.cart.length === 1) appendCartRow(line);
    return;
  }
  // Replace just this row — keeps focus elsewhere intact.
  const tmp = document.createElement('tbody');
  tmp.innerHTML = rowHTML(line);
  const newRow = tmp.firstElementChild;
  if (isIncrement) newRow.classList.add('flash');
  row.replaceWith(newRow);
}

function renderSummary() {
  const lines = state.cart.length;
  const qty = cartQty();
  const total = cartTotal();
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('stat-lines', lines.toLocaleString());
  set('stat-qty', fmtQty(qty));
  set('stat-total', fmt(total));
  set('sum-lines', lines.toLocaleString());
  set('sum-qty', fmtQty(qty));
  set('sum-total', fmt(total));
}

function renderReference() {
  const el = document.getElementById('ref-display');
  if (!el) return;
  el.innerHTML = `<div class="ref-chip">${escapeHtml(state.reference)}</div>`;
}

function renderCustomerField() {
  const el = document.getElementById('cust-selected');
  if (!el) return;
  if (state.selectedCustomer) {
    el.innerHTML = `
      <span class="customer-badge">
        <span class="dot"></span>
        ${escapeHtml(state.selectedCustomer.code || '')} · ${escapeHtml(state.selectedCustomer.name)}
      </span>
      <a class="clear-link" href="#" onclick="event.preventDefault();resetToDefaultCustomer()">reset to default</a>
    `;
  } else {
    el.innerHTML = `<span style="color:var(--danger);font-size:12px;font-weight:500">⚠ No customer with code "999" or "POS" found — please create one in Manager</span>`;
  }
}

function resetToDefaultCustomer() {
  const def = getDefaultCustomer();
  state.selectedCustomer = def ? {
    key: def.key, name: def.item?.name || 'POS', code: def.item?.code || '999',
  } : null;
  const search = document.getElementById('cust-search');
  if (search) search.value = '';
  renderCustomerField();
}

/* ══════════════════════════════════════════════════════
   Barcode + item search handlers (debounced)
══════════════════════════════════════════════════════ */
let _searchTimer = null;
let _itemMatches = [];
let _itemActiveIdx = -1;

function attachBarcodeHandlers() {
  const barcodeEl   = document.getElementById('barcode');
  const itemSuggest = document.getElementById('item-suggest');

  function closeItemSuggest() {
    itemSuggest.classList.remove('open');
    _itemActiveIdx = -1;
    _itemMatches = [];
  }

  function renderItemSuggest(q) {
    if (!q) { closeItemSuggest(); return; }
    _itemMatches = searchItems(q, 12);
    if (_itemMatches.length === 0) { closeItemSuggest(); return; }

    const qtyMap = state.qtyOwned;
    let html = '';
    for (let i = 0; i < _itemMatches.length; i++) {
      const r = _itemMatches[i];
      const code = r.item?.itemCode || '';
      const name = r.item?.itemName || '';
      const has = qtyMap && (r.key in qtyMap);
      const ownedNum = has ? qtyMap[r.key] : null;
      const owned = has ? fmtQty(ownedNum) : '—';
      const isLow = has && ownedNum <= 0;
      html += `<div class="suggest-item ${isLow?'low':''}" data-idx="${i}">
        <span class="si-code">${escapeHtml(code)}</span>
        <span class="si-name">${escapeHtml(name)}</span>
        <span class="si-stock" title="In stock">${owned}</span>
      </div>`;
    }
    itemSuggest.innerHTML = html;
    itemSuggest.classList.add('open');
    _itemActiveIdx = -1;

    itemSuggest.querySelectorAll('.suggest-item').forEach((el, idx) => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        addItemToCartByRecord(_itemMatches[idx]);
        barcodeEl.value = '';
        closeItemSuggest();
        barcodeEl.focus();
      });
    });
  }

  barcodeEl.addEventListener('input', () => {
    const v = barcodeEl.value.trim();
    clearTimeout(_searchTimer);
    // Debounce — keeps the UI responsive at 100k+ items.
    _searchTimer = setTimeout(() => renderItemSuggest(v), 60);
  });

  barcodeEl.addEventListener('keydown', (e) => {
    if (itemSuggest.classList.contains('open')) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        _itemActiveIdx = Math.min(_itemActiveIdx + 1, _itemMatches.length - 1);
        itemSuggest.querySelectorAll('.suggest-item').forEach((el, i) =>
          el.classList.toggle('active', i === _itemActiveIdx));
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        _itemActiveIdx = Math.max(_itemActiveIdx - 1, 0);
        itemSuggest.querySelectorAll('.suggest-item').forEach((el, i) =>
          el.classList.toggle('active', i === _itemActiveIdx));
        return;
      }
      if (e.key === 'Escape') { closeItemSuggest(); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (_itemActiveIdx >= 0 && _itemMatches[_itemActiveIdx]) {
          addItemToCartByRecord(_itemMatches[_itemActiveIdx]);
          barcodeEl.value = '';
          closeItemSuggest();
        } else {
          const val = barcodeEl.value.trim();
          if (val && addItemToCart(val)) {
            barcodeEl.value = '';
            closeItemSuggest();
          }
        }
        return;
      }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const val = barcodeEl.value.trim();
      if (val && addItemToCart(val)) barcodeEl.value = '';
    }
  });

  barcodeEl.addEventListener('blur', () => {
    setTimeout(closeItemSuggest, 150);
  });
}

/* ══════════════════════════════════════════════════════
   Customer search (debounced)
══════════════════════════════════════════════════════ */
let _custTimer = null;
let _custActiveIdx = -1;

function attachCustomerSearch() {
  const custSearch  = document.getElementById('cust-search');
  const custSuggest = document.getElementById('cust-suggest');

  function doRender() {
    const q = custSearch.value.trim().toLowerCase();
    if (!q) { custSuggest.classList.remove('open'); return; }
    const matches = [];
    const limit = 8;
    for (let i = 0; i < state.customers.length && matches.length < limit; i++) {
      const c = state.customers[i];
      const name = (c.item?.name || '').toLowerCase();
      const code = (c.item?.code || '').toLowerCase();
      if (name.includes(q) || code.includes(q)) matches.push(c);
    }
    if (matches.length === 0) { custSuggest.classList.remove('open'); return; }

    _custActiveIdx = -1;
    let html = '';
    for (let i = 0; i < matches.length; i++) {
      const c = matches[i];
      html += `<div class="suggest-item"
           data-key="${escapeHtml(c.key)}"
           data-name="${escapeHtml(c.item?.name || '')}"
           data-code="${escapeHtml(c.item?.code || '')}">
        <div class="name">${escapeHtml(c.item?.name || 'Unnamed')}</div>
        <div class="code">${escapeHtml(c.item?.code || 'no code')}</div>
      </div>`;
    }
    custSuggest.innerHTML = html;
    custSuggest.classList.add('open');
    custSuggest.querySelectorAll('.suggest-item').forEach(el => {
      el.addEventListener('click', () => {
        state.selectedCustomer = {
          key: el.dataset.key,
          name: el.dataset.name,
          code: el.dataset.code,
        };
        custSearch.value = '';
        custSuggest.classList.remove('open');
        renderCustomerField();
      });
    });
  }

  custSearch.addEventListener('input', () => {
    clearTimeout(_custTimer);
    _custTimer = setTimeout(doRender, 60);
  });

  custSearch.addEventListener('keydown', (e) => {
    const items = custSuggest.querySelectorAll('.suggest-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _custActiveIdx = Math.min(_custActiveIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === _custActiveIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _custActiveIdx = Math.max(_custActiveIdx - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === _custActiveIdx));
    } else if (e.key === 'Enter' && _custActiveIdx >= 0) {
      e.preventDefault();
      items[_custActiveIdx].click();
    } else if (e.key === 'Escape') {
      custSuggest.classList.remove('open');
    }
  });

  document.addEventListener('click', (e) => {
    if (!custSearch.contains(e.target) && !custSuggest.contains(e.target)) {
      custSuggest.classList.remove('open');
    }
  });
}

/* ══════════════════════════════════════════════════════
   Theme
══════════════════════════════════════════════════════ */
function toggleTheme() {
  const html = document.documentElement;
  const going = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = going;
  document.getElementById('theme-btn').textContent = going === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('pos-theme', going); } catch(e) {}
}

(function() {
  try {
    const saved = localStorage.getItem('pos-theme');
    if (saved && saved !== 'dark') {
      document.documentElement.dataset.theme = saved;
      const btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = '☀️';
    }
  } catch(e) {}
})();
</script>
