<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POS — Manager.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --royal:#1a3a6b;--royal-mid:#1e4d8c;--royal-bright:#2563b8;--royal-light:#3b82d4;
  --sapphire:#0f2d5e;--cobalt:#1a4fa0;
  --gold:#c9a84c;--gold-light:#e8c97a;--gold-pale:#f5e6b8;
  --crimson:#c0392b;--emerald:#0e7c61;--amber:#b8860b;
  --magic-gradient:linear-gradient(135deg,#1a3a6b 0%,#2563b8 45%,#1a6bb5 100%);
  --gold-gradient:linear-gradient(135deg,#b8860b 0%,#e8c97a 50%,#c9a84c 100%);
  --success-gradient:linear-gradient(135deg,#0e7c61,#1a6b9a);
  --royal-glow:rgba(37,99,184,.35);
}
[data-theme="dark"]{
  --bg-base:#05091a;--bg-card:rgba(255,255,255,.038);--bg-card-hover:rgba(255,255,255,.065);
  --bg-glass:rgba(5,12,32,.9);--border:rgba(201,168,76,.08);--border-bright:rgba(201,168,76,.16);
  --text-primary:#e8eef8;--text-secondary:#8fa4c8;--text-muted:#3d5070;
  --shadow-card:0 4px 32px rgba(0,0,0,.55),0 0 0 1px rgba(201,168,76,.06);
  --shadow-xl:0 40px 90px rgba(0,0,0,.8),0 0 60px rgba(37,99,184,.1);
  --scrollbar:rgba(201,168,76,.12);--scrollbar-hover:rgba(201,168,76,.28);
  --stat-bg:rgba(26,58,107,.18);--stat-border:rgba(201,168,76,.1);
  --cart-bg:rgba(5,12,32,.4);--cart-row-hover:rgba(37,99,184,.08);--cart-border:rgba(201,168,76,.07);
  --input-bg:rgba(255,255,255,.05);--input-border:rgba(201,168,76,.14);
  --suggest-bg:#060c20;--suggest-hover:rgba(37,99,184,.12);
  --summary-bg:rgba(37,99,184,.07);--summary-border:rgba(201,168,76,.14);
  --bar-bg:rgba(255,255,255,.07);
  --body-bg:
    radial-gradient(ellipse 80% 60% at 20% -10%,rgba(37,99,184,.18),transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 15%,rgba(26,58,107,.22),transparent 55%),
    radial-gradient(ellipse 50% 40% at 10% 90%,rgba(201,168,76,.05),transparent 50%),
    radial-gradient(ellipse 70% 60% at 90% 95%,rgba(37,99,184,.08),transparent 55%),
    linear-gradient(180deg,#040816 0%,#060c1e 40%,#050a18 70%,#030710 100%);
}
[data-theme="light"]{
  --bg-base:#f0f4fb;--bg-card:rgba(255,255,255,.97);--bg-card-hover:#ffffff;
  --bg-glass:rgba(255,255,255,.93);--border:rgba(37,99,184,.1);--border-bright:rgba(37,99,184,.2);
  --text-primary:#0d1f40;--text-secondary:#3a5280;--text-muted:#7a90b8;
  --shadow-card:0 4px 28px rgba(26,58,107,.1),0 0 0 1px rgba(37,99,184,.06);
  --shadow-xl:0 40px 80px rgba(26,58,107,.2);
  --scrollbar:rgba(37,99,184,.14);--scrollbar-hover:rgba(37,99,184,.3);
  --stat-bg:rgba(240,244,251,.9);--stat-border:rgba(37,99,184,.1);
  --cart-bg:#ffffff;--cart-row-hover:rgba(37,99,184,.04);--cart-border:rgba(37,99,184,.08);
  --input-bg:#ffffff;--input-border:rgba(37,99,184,.18);
  --suggest-bg:#ffffff;--suggest-hover:rgba(37,99,184,.06);
  --summary-bg:rgba(37,99,184,.04);--summary-border:rgba(37,99,184,.16);
  --bar-bg:rgba(37,99,184,.1);
  --body-bg:
    radial-gradient(ellipse 80% 60% at 15% -5%,rgba(37,99,184,.09),transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 10%,rgba(201,168,76,.07),transparent 55%),
    radial-gradient(ellipse 70% 60% at 50% 100%,rgba(37,99,184,.05),transparent 60%),
    linear-gradient(180deg,#edf2fb 0%,#f3f7fd 40%,#f8faff 70%,#eef5fb 100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text-primary);background:var(--body-bg);background-attachment:fixed;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;transition:background .4s,color .3s}

/* CTRL BAR */
.ctrl-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;margin-bottom:20px;background:var(--bg-glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border:1px solid var(--border-bright);box-shadow:var(--shadow-card),0 0 0 1px rgba(201,168,76,.05) inset;border-radius:18px;transition:background .3s,border .3s;position:relative;overflow:hidden}
.ctrl-bar::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.03) 0%,transparent 60%);pointer-events:none}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.02em;background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-flex;align-items:center;gap:10px}
.brand-gem{width:34px;height:34px;border-radius:10px;background:var(--magic-gradient);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(37,99,184,.5),0 0 0 1px rgba(201,168,76,.2) inset;font-size:16px;flex-shrink:0;animation:gem-float 4s ease-in-out infinite;position:relative}
.brand-gem::after{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,rgba(201,168,76,.2),transparent);pointer-events:none}
@keyframes gem-float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(5deg)}}
.load-btn{padding:9px 22px;border:none;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',inherit;color:#fff;background:var(--magic-gradient);box-shadow:0 4px 18px rgba(37,99,184,.4),inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(201,168,76,.1);white-space:nowrap;letter-spacing:.04em;text-transform:uppercase;transition:all .22s ease;position:relative;overflow:hidden}
.load-btn::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transition:left .4s}
.load-btn:hover:not(:disabled)::before{left:100%}
.load-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 28px rgba(37,99,184,.55),inset 0 1px 0 rgba(255,255,255,.22)}
.load-btn:disabled{opacity:.4;cursor:not-allowed}
.progress-wrap{flex:1;min-width:100px;height:4px;background:var(--bar-bg);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.progress-bar{height:100%;width:0%;background:var(--gold-gradient);border-radius:99px;transition:width .35s ease;box-shadow:0 0 8px rgba(201,168,76,.4)}
.status-text{font-size:11px;color:var(--text-muted);white-space:nowrap;font-weight:500;font-family:'JetBrains Mono',monospace;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.theme-toggle{width:38px;height:38px;border-radius:10px;border:1px solid var(--border-bright);background:var(--bg-card);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0}
.theme-toggle:hover{transform:rotate(22deg) scale(1.12);box-shadow:0 0 20px rgba(201,168,76,.25)}
.debug-toggle{font-size:11px;color:var(--text-muted);cursor:pointer;background:var(--bg-card);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-weight:600;font-family:inherit;transition:all .15s;letter-spacing:.03em}
.debug-toggle:hover{color:var(--gold);border-color:rgba(201,168,76,.35)}

/* DEBUG */
.debug-log{background:#06080f;border-radius:12px;padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b;max-height:140px;overflow-y:auto;margin-bottom:16px;display:none;white-space:pre-wrap;word-break:break-all;border:1px solid rgba(255,255,255,.05);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.debug-log.show{display:block}
.debug-log .ok{color:#34d399}.debug-log .fail{color:#fb7185}.debug-log .info{color:#818cf8}

/* LAYOUT */
.pos-container{display:grid;grid-template-columns:1fr 430px;gap:18px;min-height:calc(100vh - 120px)}
@media(max-width:960px){.pos-container{grid-template-columns:1fr}}

/* PANEL */
.pos-panel{background:var(--bg-card);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--border);box-shadow:var(--shadow-card);border-radius:22px;padding:24px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:background .3s,border .3s}
.pos-panel::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--magic-gradient);opacity:.8}
.pos-panel::after{content:"";position:absolute;top:-80px;right:-80px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.07),transparent 70%);pointer-events:none}
.panel-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--text-muted);margin-bottom:20px;display:flex;align-items:center;gap:8px}
.panel-title .dot{width:5px;height:5px;border-radius:50%;background:var(--magic-gradient);box-shadow:0 0 8px rgba(139,92,246,.6)}

/* FORM */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-field{display:flex;flex-direction:column}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:6px;font-weight:700}
.form-field input,.form-field textarea,.form-field select{background:var(--input-bg);border:1.5px solid var(--input-border);border-radius:11px;padding:11px 14px;color:var(--text-primary);font-size:13px;font-family:inherit;font-weight:500;transition:all .15s ease}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.13)}
.form-field input::placeholder{color:var(--text-muted);font-weight:400}

/* BARCODE */
.barcode-wrap{position:relative;margin-bottom:14px}
.barcode-input{width:100%;font-size:17px!important;font-weight:600!important;padding:15px 18px 15px 52px!important;font-family:'JetBrains Mono',monospace!important;border-radius:15px!important;letter-spacing:.02em;color:var(--text-primary);box-shadow:0 6px 24px rgba(99,102,241,.1);transition:all .2s}
[data-theme="dark"] .barcode-input{background:rgba(255,255,255,.06)!important;border:2px solid rgba(139,92,246,.35)!important}
[data-theme="light"] .barcode-input{background:#fff!important;border:2px solid transparent!important;background-image:linear-gradient(#fff,#fff),var(--magic-gradient)!important;background-origin:padding-box,border-box!important;background-clip:padding-box,border-box!important}
.barcode-input:focus{outline:none;box-shadow:0 10px 32px rgba(236,72,153,.22),0 0 0 4px rgba(236,72,153,.07)!important}
[data-theme="dark"] .barcode-input:focus{border-color:rgba(236,72,153,.6)!important}
.barcode-input::placeholder{color:var(--text-muted);font-weight:500;letter-spacing:0}
.barcode-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--violet);pointer-events:none;opacity:.7}
.scanner-status{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--emerald);margin-top:8px;padding-left:4px}
.scanner-dot{width:7px;height:7px;background:var(--emerald);border-radius:50%;box-shadow:0 0 0 3px rgba(16,185,129,.2);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 3px rgba(16,185,129,.2)}50%{opacity:.5;box-shadow:0 0 0 7px rgba(16,185,129,.04)}}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:var(--stat-bg);border:1px solid var(--stat-border);border-radius:14px;padding:14px 10px;text-align:center;transition:all .2s;position:relative;overflow:hidden;cursor:default}
.stat-box::before{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--magic-gradient);opacity:0;transition:opacity .2s}
.stat-box:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(139,92,246,.15)}
.stat-box:hover::before{opacity:.7}
.stat-box .val{font-size:22px;font-weight:800;color:var(--text-primary);letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.stat-box.accent .val{background:var(--success-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-box .lbl{font-size:9px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.12em;margin-top:4px;font-weight:700}

/* CART TABLE */
.cart-wrap{flex:1;overflow:auto;border:1px solid var(--cart-border);border-radius:16px;background:var(--cart-bg);box-shadow:0 2px 12px rgba(0,0,0,.06);transition:background .3s,border .3s}
.cart-table{width:100%;border-collapse:collapse;font-size:13px}
.cart-table thead{background:var(--bg-glass);backdrop-filter:blur(12px);position:sticky;top:0;z-index:2}
.cart-table th{text-align:left;padding:11px 14px;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);font-weight:700;border-bottom:1px solid var(--cart-border)}
.cart-table td{padding:11px 14px;border-bottom:1px solid var(--cart-border);vertical-align:middle}
.cart-table tbody tr{transition:background .12s}
.cart-table tbody tr:hover{background:var(--cart-row-hover)}
.cart-table tbody tr:last-child td{border-bottom:none}
.cart-table tbody tr.new-row{animation:flash .8s ease}
@keyframes flash{0%{background:rgba(139,92,246,.2)}100%{background:transparent}}
.qty-input,.price-input{width:72px;background:var(--input-bg);border:1.5px solid var(--input-border);border-radius:8px;padding:5px 9px;color:var(--text-primary);font-size:13px;font-weight:600;text-align:right;font-family:'JetBrains Mono',monospace;transition:all .15s}
.price-input{width:90px}
.qty-input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.price-input[readonly]{background:var(--bg-card);color:var(--text-muted);cursor:not-allowed;border-color:var(--border)}
.price-input[readonly]:focus{box-shadow:none;border-color:var(--border)}
.qty-owned-cell{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;text-align:right;padding:11px 10px!important}
.qty-owned-ok{color:var(--emerald)}
.qty-owned-warn{color:var(--amber)}
.qty-owned-over{color:var(--rose);background:rgba(244,63,94,.1);border-radius:6px;padding:2px 6px!important}
.qty-owned-na{color:var(--text-muted)}
.qty-over-row td{background:rgba(244,63,94,.04)!important}
.line-total{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--emerald);font-size:13px}
.remove-btn{background:transparent;border:1.5px solid var(--border);color:var(--text-muted);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:16px;line-height:1.2;font-weight:600;transition:all .15s;font-family:inherit}
.remove-btn:hover{background:var(--rose);color:#fff;border-color:var(--rose);transform:scale(1.05)}
.empty-cart{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-cart .big{font-size:52px;margin-bottom:14px;display:inline-block;background:var(--magic-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 12px rgba(139,92,246,.25));line-height:1;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.empty-cart .main-text{font-size:14px;color:var(--text-secondary);font-weight:700;margin-bottom:4px}
.empty-cart .sub-text{font-size:12px;color:var(--text-muted)}

/* SUMMARY */
.summary{background:var(--summary-bg);border:1px solid var(--summary-border);border-radius:16px;padding:16px 20px;margin-bottom:14px;position:relative;overflow:hidden;transition:background .3s,border .3s}
.summary::before{content:"";position:absolute;top:0;right:0;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.08),transparent 70%);pointer-events:none}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;color:var(--text-secondary);font-weight:500}
.summary-row span:last-child{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text-primary);font-family:'JetBrains Mono',monospace}
.summary-row.total{border-top:1px dashed var(--summary-border);margin-top:10px;padding-top:14px}
.summary-row.total span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);font-weight:700}
.summary-row.total span:last-child{font-size:28px;font-weight:800;letter-spacing:-0.04em;background:var(--success-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-family:'Syne',sans-serif}

/* ACTIONS */
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.btn{padding:14px 18px;border:none;border-radius:13px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s ease;font-family:inherit;text-transform:uppercase;letter-spacing:.06em;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent);opacity:0;transition:opacity .2s}
.btn:hover::after{opacity:1}
.btn-primary{background:var(--magic-gradient);color:#fff;box-shadow:0 8px 22px -4px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 30px -4px rgba(236,72,153,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--bg-card);color:var(--text-secondary);border:1.5px solid var(--border-bright)}
.btn-secondary:hover{background:var(--bg-card-hover);border-color:var(--rose);color:var(--rose)}

/* TOAST */
.toast{position:fixed;top:22px;right:22px;padding:14px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:9999;animation:slideIn .35s cubic-bezier(.2,1,.3,1);max-width:440px;box-shadow:var(--shadow-xl);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12)}
.toast.success{background:linear-gradient(135deg,rgba(16,185,129,.96),rgba(20,184,166,.96));color:#fff}
.toast.error{background:linear-gradient(135deg,rgba(244,63,94,.96),rgba(236,72,153,.96));color:#fff}
.toast.info{background:linear-gradient(135deg,rgba(99,102,241,.96),rgba(139,92,246,.96));color:#fff}
@keyframes slideIn{from{transform:translateX(500px) scale(.85);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}

/* CUSTOMER */
.customer-display{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.customer-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.22);border-radius:99px;font-size:12px;font-weight:700;color:var(--violet)}
.customer-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--magic-gradient);box-shadow:0 0 8px rgba(139,92,246,.5)}
.clear-link{font-size:11px;color:var(--rose);font-weight:600;cursor:pointer;text-decoration:none}
.clear-link:hover{text-decoration:underline}

/* SUGGEST */
.suggest-wrap{position:relative}
.suggest-list{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--suggest-bg);border:1px solid var(--border-bright);border-radius:14px;max-height:260px;overflow-y:auto;z-index:200;display:none;box-shadow:var(--shadow-xl);backdrop-filter:blur(20px)}
.suggest-list.open{display:block}
.suggest-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover,.suggest-item.active{background:var(--suggest-hover)}
.suggest-item .name{font-size:13px;font-weight:600;color:var(--text-primary)}
.suggest-item .code{font-size:11px;color:var(--text-muted);margin-top:2px;font-family:'JetBrains Mono',monospace}
.item-suggest-list{max-height:340px}
.item-suggest-list .suggest-item{display:grid;grid-template-columns:90px 1fr 70px;align-items:center;gap:8px;padding:9px 14px}
.item-suggest-list .suggest-item-low{opacity:.55}
.si-code{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--indigo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-name{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-stock{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--emerald);text-align:right}
.item-suggest-list .suggest-item-low .si-stock{color:var(--rose)}

/* DIVIDER & CHIPS */
.divider-label{display:flex;align-items:center;gap:10px;font-size:9px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.12em;margin:18px 0 12px;font-weight:700}
.divider-label::before,.divider-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border-bright),transparent)}

<script>

/* ══════════════════════════════════════════════
   Capture managerAppContext from parent
══════════════════════════════════════════════ */
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'manager-context' && event.data.payload) {
    window.managerAppContext = event.data.payload;
    debugLog('info', '✓ managerAppContext received: ' +
      (window.managerAppContext.apiEndpoint || '(no apiEndpoint)'));
  }
});

function toggleDebug() {
  document.getElementById('debug-log').classList.toggle('show');
}
function debugLog(type, msg) {
  const el = document.getElementById('debug-log');
  if (!el) return;
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = type;
  line.textContent = `[${time}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

/* ══════════════════════════════════════════════
   postMessage helper — DO NOT MODIFY
══════════════════════════════════════════════ */
function postMessageWithResponse(message) {
  return new Promise((resolve, reject) => {
    const requestId = crypto.randomUUID();
    const timer = setTimeout(() => {
      window.removeEventListener('message', handler);
      reject(new Error('Timeout — is this running inside Manager?'));
    }, 15000);
    function handler(event) {
      if (event.data?.type?.endsWith('-response') && event.data?.requestId === requestId) {
        clearTimeout(timer);
        window.removeEventListener('message', handler);
        if (event.data.error) {
          reject(new Error(event.data.error));
        } else {
          resolve(event.data.body);
        }
      }
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ ...message, requestId }, '*');
  });
}

/* ══════════════════════════════════════════════
   Direct fetch via managerAppContext
══════════════════════════════════════════════ */
async function directFetch(method, path, body) {
  const ctx = window.managerAppContext;
  if (!ctx || !ctx.apiEndpoint) {
    throw new Error('managerAppContext not available');
  }
  let url;
  if (path.startsWith('http')) {
    url = path;
  } else {
    const base = ctx.apiEndpoint.replace(/\/+$/, '');
    url = base + (path.startsWith('/') ? path : '/' + path);
  }
  const opts = {
    method,
    headers: {
      'Authorization': 'Bearer ' + ctx.apiAccessToken,
      'Content-Type': 'application/json',
      'Accept': 'application/json',
    },
  };
  if (body !== undefined && body !== null) {
    opts.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  debugLog('info', `→ ${method} ${url}`);
  const resp = await fetch(url, opts);
  const text = await resp.text();
  debugLog(resp.ok ? 'ok' : 'fail',
    `← ${resp.status} ${resp.statusText} · ${text.substring(0, 160)}`);
  if (!resp.ok) {
    throw new Error(`HTTP ${resp.status}: ${text.substring(0, 200)}`);
  }
  try { return JSON.parse(text); } catch { return text; }
}

async function apiCall(method, path, body) {
  // Use ONLY postMessage — no fallback to direct fetch.
  // The previous fallback was causing duplicate invoices: Manager would
  // create the invoice successfully via postMessage but occasionally the
  // response shape didn't match what postMessageWithResponse expected, so
  // it would throw — triggering the directFetch fallback, which created
  // a SECOND identical invoice.
  const msg = { type: 'api-request', method, path };
  if (body !== undefined && body !== null) msg.body = body;
  const result = await postMessageWithResponse(msg);
  debugLog('ok', `postMessage ${method} ${path} succeeded`);
  return result;
}

/* ══════════════════════════════════════════════
   Paginated batch fetch
══════════════════════════════════════════════ */
async function getBatchEndpoint(endpointPath, onProgress) {
  const allItems = [];
  let nextToken  = null;
  let pageNum    = 0;
  let apiTotal   = null;

  // For read-only GET requests, prefer directFetch when managerAppContext is
  // available — it hits the API directly without the postMessage relay, which
  // is significantly faster for large paginated datasets (100k+ records).
  // We only avoid directFetch for writes (see apiCall) to prevent duplicates.
  const canDirect = !!(window.managerAppContext?.apiEndpoint);

  do {
    const path = nextToken
      ? endpointPath + '?PageSize=99999&next_page_token=' + encodeURIComponent(nextToken)
      : endpointPath + '?PageSize=99999';

    const data = canDirect
      ? await directFetch('GET', path)
      : await postMessageWithResponse({ type: 'api-request', method: 'GET', path });

    const page = Array.isArray(data) ? data : (data.items || []);
    allItems.push(...page);

    nextToken = data.next_page_token || data.nextPageToken
      || data._links?.next?.href || null;

    if (apiTotal === null) {
      apiTotal = data.totalCount ?? data.total ?? data.count
        ?? data._metadata?.totalCount ?? null;
    }

    pageNum++;
    if (onProgress) onProgress(allItems.length, apiTotal, pageNum);

    if (pageNum >= 1000) break;

  } while (nextToken);

  return allItems;
}

async function getBatchInventoryItem(onProgress) {
  return getBatchEndpoint('/api4/inventory-item-batch', onProgress);
}

/* ══════════════════════════════════════════════
   Compute qty owned per inventory item key.

   Formula (matches Manager's internal calculation):
     qtyOwned
       + Starting Balance  → item-starting-balance-batch
                             rec.item.key (= the inventory item key)
                             rec.item.qtyOnHandLines[].qtyOnHand  (sum all locations)
       + Purchase Invoices → purchase-invoice-batch
                             lines[].item (uuid) + lines[].qty
       - Debit Notes       → debit-note-batch (returns TO supplier, stock goes OUT)
                             lines[].item (uuid) + lines[].qty
       - Sales Invoices    → sales-invoice-batch
                             lines[].item (uuid) + lines[].qty
       + Credit Notes      → credit-note-batch (returns FROM customer, stock comes BACK)
                             lines[].item (uuid) + lines[].qty
       - Inventory Write-offs → inventory-write-off-batch
                             items[].inventoryItem (uuid) + items[].qty
══════════════════════════════════════════════ */
async function computeQtyOwned(onProgress) {
  onProgress && onProgress('Fetching stock data (6 sources)…');

  const fetchBatch = (path, label) =>
    getBatchEndpoint(path).catch(e => {
      debugLog('fail', `${label} fetch failed: ${e.message}`);
      return [];
    });

  const [
    startingBalances,
    purchaseInvoices,
    debitNotes,
    salesInvoices,
    creditNotes,
    writeOffs,
  ] = await Promise.all([
    fetchBatch('/api4/inventory-item-starting-balance-batch', 'Starting balances'),
    fetchBatch('/api4/purchase-invoice-batch',                'Purchase invoices'),
    fetchBatch('/api4/debit-note-batch',                     'Debit notes'),
    fetchBatch('/api4/sales-invoice-batch',                  'Sales invoices'),
    fetchBatch('/api4/credit-note-batch',                    'Credit notes'),
    fetchBatch('/api4/inventory-write-off-batch',            'Write-offs'),
  ]);

  debugLog('info',
    `Stock sources — starting:${startingBalances.length} ` +
    `purchases:${purchaseInvoices.length} debitNotes:${debitNotes.length} ` +
    `sales:${salesInvoices.length} creditNotes:${creditNotes.length} writeOffs:${writeOffs.length}`
  );

  const qtyMap = {}; // itemKey -> qty

  const add = (itemKey, qty) => {
    if (!itemKey) return;
    qtyMap[itemKey] = (qtyMap[itemKey] || 0) + (Number(qty) || 0);
  };
  const sub = (itemKey, qty) => {
    if (!itemKey) return;
    qtyMap[itemKey] = (qtyMap[itemKey] || 0) - (Number(qty) || 0);
  };

  // ── 1. Starting balances ─────────────────────────────────────────────────
  // rec.key  = the starting-balance record's own UUID  ← NOT the item key
  // rec.item.key (d.key) = the inventory item UUID     ← correct key to use
  // qtyOnHandLines is an array of { inventoryLocation, qtyOnHand } — sum all.
  for (const rec of startingBalances) {
    const d = rec.item || rec;
    // IMPORTANT: do NOT use rec.key here — it is the SB record's own key,
    // not the inventory item key.  Use d.key (= rec.item.key) first.
    const itemKey = d.key || d.inventoryItem || null;
    const lines   = d.qtyOnHandLines || [];
    if (lines.length > 0) {
      for (const l of lines) add(itemKey, l.qtyOnHand);
    } else {
      // Fallback: older API versions may expose qtyOwned directly
      const qty = d.qtyOwned ?? 0;
      add(itemKey, qty);
    }
  }

  // ── 2. Purchase invoices — stock IN ─────────────────────────────────────
  for (const rec of purchaseInvoices) {
    for (const line of (rec.item?.lines || [])) {
      if (line.item) add(line.item, line.qty);
    }
  }

  // ── 3. Debit notes — returns TO supplier, stock OUT ──────────────────────
  for (const rec of debitNotes) {
    for (const line of (rec.item?.lines || [])) {
      if (line.item) sub(line.item, line.qty);
    }
  }

  // ── 4. Sales invoices — stock OUT ────────────────────────────────────────
  for (const rec of salesInvoices) {
    for (const line of (rec.item?.lines || [])) {
      if (line.item) sub(line.item, line.qty);
    }
  }

  // ── 5. Credit notes — returns FROM customer, stock IN ───────────────────
  for (const rec of creditNotes) {
    for (const line of (rec.item?.lines || [])) {
      if (line.item) add(line.item, line.qty);
    }
  }

  // ── 6. Inventory write-offs — stock OUT ─────────────────────────────────
  // Write-off structure: rec.item.items[] → { inventoryItem, qty }
  // (NOT lines[].item — different schema)
  for (const rec of writeOffs) {
    for (const entry of (rec.item?.items || [])) {
      if (entry.inventoryItem) sub(entry.inventoryItem, entry.qty);
    }
  }

  debugLog('ok', `qtyOwned computed for ${Object.keys(qtyMap).length} unique items`);
  return qtyMap; // { itemKey: number }
}

/* ══════════════════════════════════════════════
   State
══════════════════════════════════════════════ */
const state = {
  items: [],
  customers: [],
  cart: [],
  selectedCustomer: null,
  reference: '',
  qtyOwned: {}, // itemKey -> computed stock level
};

/* ══════════════════════════════════════════════
   Auto-generate unique reference — POS-YYMMDD-HHMMSS
══════════════════════════════════════════════ */
function generateReference() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const yy = pad(d.getFullYear() % 100);
  const mm = pad(d.getMonth() + 1);
  const dd = pad(d.getDate());
  const hh = pad(d.getHours());
  const mi = pad(d.getMinutes());
  const ss = pad(d.getSeconds());
  return `POS-${yy}${mm}${dd}-${hh}${mi}${ss}`;
}

/* ══════════════════════════════════════════════
   Load
══════════════════════════════════════════════ */
async function loadAllRecords() {
  const btn    = document.getElementById('load-btn');
  const bar    = document.getElementById('prog-bar');
  const status = document.getElementById('status-text');
  const app    = document.getElementById('app');

  btn.disabled = true;
  btn.textContent = 'Loading…';
  bar.style.width = '0%';
  app.innerHTML = '';

  try {
    // Fetch items and customers in parallel — no dependency between them.
    status.textContent = 'Fetching items & customers in parallel…';
    bar.style.width = '5%';

    let itemsDone = false, custsDone = false;
    const updateParallelStatus = (label, loaded, total) => {
      status.textContent = total
        ? `${label} · ${loaded.toLocaleString()} / ${total.toLocaleString()}${itemsDone ? ' · items ✓' : ''}${custsDone ? ' · customers ✓' : ''}`
        : `${label} · ${loaded.toLocaleString()} loaded…`;
    };

    const [items, customers] = await Promise.all([
      getBatchInventoryItem((loaded, total, page) => {
        updateParallelStatus(`Items · Page ${page}`, loaded, total);
        if (total) bar.style.width = Math.min(20, Math.round(loaded / total * 20)) + '%';
      }).then(r => { itemsDone = true; return r; }),
      getBatchEndpoint('/api4/customer-batch', (loaded, total, page) => {
        updateParallelStatus(`Customers · Page ${page}`, loaded, total);
      }).then(r => { custsDone = true; return r; }),
    ]);

    state.items = items;
    state.customers = customers;

    // Compute qty owned: starting balances + purchases - sales
    status.textContent = 'Computing stock levels (starting balances + purchases − sales)…';
    bar.style.width = '42%';
    const qtyOwned = await computeQtyOwned(msg => { status.textContent = msg; });
    state.qtyOwned = qtyOwned; // { itemKey: number }
    bar.style.width = '100%';

    const ownedCount = Object.keys(qtyOwned).length;
    status.textContent = `✓ ${items.length.toLocaleString()} items · ${customers.length.toLocaleString()} customers · stock computed for ${ownedCount.toLocaleString()} items`;
    btn.textContent = '↻ Reload';
    btn.disabled = false;

    // Auto-select default 999/POS customer
    const def = getDefaultCustomer();
    if (def) {
      state.selectedCustomer = {
        key: def.key,
        name: def.item?.name || 'POS',
        code: def.item?.code || '999',
      };
    }
    // Auto-generate reference
    state.reference = generateReference();

    render();

  } catch (err) {
    status.textContent = '⚠ ' + err.message;
    btn.textContent = '↻ Retry';
    btn.disabled = false;
    app.innerHTML = `<div class="error-box">⚠ ${err.message}<br><small>Make sure this extension is running inside Manager.io</small></div>`;
  }
}

/* ══════════════════════════════════════════════
   Helpers
══════════════════════════════════════════════ */
const fmt = v => (Number(v) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayISO = () => new Date().toISOString().slice(0, 10);

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

function findItemByBarcode(code) {
  if (!code) return null;
  const needle = code.trim().toLowerCase();
  let found = state.items.find(r => (r.item?.itemCode || '').toLowerCase() === needle);
  if (found) return found;
  found = state.items.find(r => (r.item?.itemName || '').toLowerCase() === needle);
  if (found) return found;
  found = state.items.find(r => (r.item?.itemCode || '').toLowerCase().startsWith(needle) && needle.length >= 2);
  return found || null;
}

function getDefaultCustomer() {
  return state.customers.find(c =>
    (c.item?.code || '').trim() === '999' ||
    (c.item?.code || '').toLowerCase().includes('pos') ||
    (c.item?.name || '').toLowerCase() === 'pos'
  );
}

/* ══════════════════════════════════════════════
   Cart
══════════════════════════════════════════════ */
function addItemToCartByRecord(rec) {
  if (!rec) return false;
  const key = rec.key;
  const existing = state.cart.find(l => l.key === key);
  if (existing) {
    existing.qty = (Number(existing.qty) || 0) + 1;
    existing.isNew = true;
  } else {
    state.cart.push({
      key,
      itemCode: rec.item?.itemCode || '',
      itemName: rec.item?.itemName || 'Item',
      qty: rec.item?.hasDefaultQty && rec.item?.defaultQty ? rec.item.defaultQty : 1,
      unitPrice: rec.item?.hasDefaultSalesUnitPrice ? (rec.item.defaultSalesUnitPrice || 0) : 0,
      description: rec.item?.hasDefaultLineDescription ? (rec.item.defaultLineDescription || '') : '',
      qtyOwned: (state.qtyOwned && key in state.qtyOwned) ? state.qtyOwned[key] : null,
      isNew: true,
    });
  }
  renderCart();
  return true;
}

function addItemToCart(barcode) {
  const rec = findItemByBarcode(barcode);
  if (!rec) {
    toast(`No item matches "${barcode}"`, 'error');
    return false;
  }
  return addItemToCartByRecord(rec);
}

function updateCartQty(key, qty) {
  const line = state.cart.find(l => l.key === key);
  if (!line) return;
  const n = Number(qty);
  line.qty = isNaN(n) || n < 0 ? 0 : n;
  renderCart();
}

function updateCartPrice(key, price) {
  const line = state.cart.find(l => l.key === key);
  if (!line) return;
  const n = Number(price);
  line.unitPrice = isNaN(n) || n < 0 ? 0 : n;
  renderSummary();
  const totalCell = document.querySelector(`tr[data-key="${key}"] .line-total`);
  if (totalCell) totalCell.textContent = fmt((Number(line.qty) || 0) * (Number(line.unitPrice) || 0));
}

function removeFromCart(key) {
  state.cart = state.cart.filter(l => l.key !== key);
  renderCart();
}

function clearCart() {
  if (state.cart.length === 0) return;
  if (!confirm('Clear all items from the current sale?')) return;
  state.cart = [];
  renderCart();
}

/* ══════════════════════════════════════════════
   Submit sale
══════════════════════════════════════════════ */
// Global flag to prevent double-submit from rapid clicks / reentrance
let isSubmitting = false;

async function submitSale() {
  if (isSubmitting) {
    debugLog('fail', '⚠ Submit already in progress — ignoring duplicate click');
    return;
  }

  if (state.cart.length === 0) {
    toast('Cart is empty — scan items first', 'error');
    return;
  }

  // ── Stock validation: block if any item exceeds qty owned ──
  const overStockLines = state.cart.filter(l => {
    const owned = l.qtyOwned;
    return owned !== null && (Number(l.qty) || 0) > owned;
  });
  if (overStockLines.length > 0) {
    const names = overStockLines.map(l => `"${l.itemName}" (selling ${l.qty}, owned ${l.qtyOwned})`).join(', ');
    toast(`⚠ Cannot complete sale — quantity exceeds stock for: ${names}`, 'error');
    debugLog('fail', `Stock overrun blocked: ${names}`);
    return;
  }

  let customer = state.selectedCustomer;
  if (!customer) {
    const def = getDefaultCustomer();
    if (def) {
      customer = { key: def.key, name: def.item?.name || 'POS', code: def.item?.code || '999' };
    }
  }
  if (!customer) {
    toast('No customer with code "999" or "POS" found. Please create one in Manager.', 'error');
    return;
  }

  isSubmitting = true;

  const issueDate = document.getElementById('issue-date').value || todayISO();
  const custName = document.getElementById('cust-name-free').value.trim();
  const custPhone = document.getElementById('cust-phone').value.trim();

  let description = '';
  if (custName || custPhone) {
    const bits = [];
    if (custName) bits.push('Name: ' + custName);
    if (custPhone) bits.push('Phone: ' + custPhone);
    description = bits.join(' · ');
  }

  const reference = state.reference || generateReference();

  const payloadCamel = {
    IssueDate: issueDate,
    Reference: reference,
    Customer: customer.key,
    Description: description || null,
    Lines: state.cart.map(l => ({
      Item: l.key,
      LineDescription: l.description || '',
      Qty: Number(l.qty) || 0,
      SalesUnitPrice: Number(l.unitPrice) || 0,
    })),
  };

  const payloadLower = {
    issueDate: issueDate + 'T00:00:00',
    reference: reference,
    customer: customer.key,
    description: description || null,
    lines: state.cart.map(l => ({
      item: l.key,
      lineDescription: l.description || '',
      qty: Number(l.qty) || 0,
      salesUnitPrice: Number(l.unitPrice) || 0,
    })),
  };

  // ONE UUID generated ONCE — reused across all attempts.
  // This makes PUT calls IDEMPOTENT: if multiple attempts succeed,
  // Manager will see the same UUID and update the single record
  // rather than creating duplicates.
  const newKey = crypto.randomUUID();

  // Only UUID-based PUT endpoints — NEVER POST without a UUID,
  // because POST endpoints create a new record every call and
  // would cause duplicates if we retry after a false-negative.
  const attempts = [
    { method: 'PUT', path: `/api2/sales-invoice-form/${newKey}`, body: payloadCamel, label: 'PUT /api2/sales-invoice-form/{uuid}' },
    { method: 'PUT', path: `/api4/sales-invoice-form/${newKey}`, body: payloadLower, label: 'PUT /api4/sales-invoice-form/{uuid}' },
    { method: 'PUT', path: `/api4/sales-invoice/${newKey}`,      body: payloadLower, label: 'PUT /api4/sales-invoice/{uuid}' },
  ];

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Processing…';

  debugLog('info', `═══ Submit sale · ref ${reference} · uuid ${newKey} ═══`);

  let lastErr = null;
  let success = false;

  for (const attempt of attempts) {
    try {
      debugLog('info', `Trying: ${attempt.label}`);
      await apiCall(attempt.method, attempt.path, attempt.body);
      success = true;
      debugLog('ok', `✓ SUCCESS via ${attempt.label}`);
      break;
    } catch (err) {
      lastErr = err;
      debugLog('fail', `✗ ${attempt.label} → ${err.message.substring(0, 140)}`);
    }
  }

  btn.disabled = false;
  btn.textContent = 'Complete Sale';
  isSubmitting = false;

  if (success) {
    toast(`✓ Sale saved · ${reference} · ${fmt(cartTotal())}`, 'success');

    // ── Update stock levels locally (subtract sold qty from qtyOwned map) ──
    for (const line of state.cart) {
      const soldQty = Number(line.qty) || 0;
      if (line.key && state.qtyOwned && line.key in state.qtyOwned) {
        state.qtyOwned[line.key] = (state.qtyOwned[line.key] || 0) - soldQty;
      }
    }
    debugLog('ok', `Stock levels updated locally after sale ${reference}`);
    // Reset
    state.cart = [];
    // Keep default customer selected, reset walk-in fields
    const def = getDefaultCustomer();
    state.selectedCustomer = def ? {
      key: def.key,
      name: def.item?.name || 'POS',
      code: def.item?.code || '999',
    } : null;
    // New reference for next sale
    state.reference = generateReference();

    document.getElementById('cust-name-free').value = '';
    document.getElementById('cust-phone').value = '';
    document.getElementById('cust-search').value = '';
    document.getElementById('issue-date').value = todayISO();
    renderCart();
    renderCustomerField();
    renderReference();
    document.getElementById('barcode').focus();
  } else {
    const msg = lastErr ? lastErr.message : 'Unknown error';
    toast(`Failed to save sale. ${msg.substring(0, 200)}. Check Debug panel.`, 'error');
    document.getElementById('debug-log').classList.add('show');
  }
}

/* ══════════════════════════════════════════════
   Totals
══════════════════════════════════════════════ */
function cartTotal() {
  return state.cart.reduce((sum, l) => sum + (Number(l.qty) || 0) * (Number(l.unitPrice) || 0), 0);
}
function cartQty() {
  return state.cart.reduce((sum, l) => sum + (Number(l.qty) || 0), 0);
}

/* ══════════════════════════════════════════════
   Render
══════════════════════════════════════════════ */
function render() {
  const app = document.getElementById('app');

  if (state.items.length === 0) {
    app.innerHTML = `<div class="error-box" style="color:var(--slate-500)">No inventory items loaded. Add items in Manager first, then reload.</div>`;
    return;
  }

  app.innerHTML = `
    <div class="pos-container">
      <!-- LEFT PANEL -->
      <div class="pos-panel">
        <div class="panel-title"><span class="dot"></span> Current Sale</div>

        <div class="form-field full">
          <label>Barcode / Item Search — scan, type code or name, then Enter or select</label>
          <div class="barcode-wrap suggest-wrap" style="position:relative">
            <svg class="barcode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <path d="M7 8v8M10 8v8M13 8v8M16 8v8"/>
            </svg>
            <input type="text" id="barcode" class="barcode-input"
                   placeholder="Scan barcode or type item code / name…"
                   autocomplete="off" />
            <div class="suggest-list item-suggest-list" id="item-suggest"></div>
          </div>
          <div class="scanner-status">
            <span class="scanner-dot"></span>
            <span>Scanner ready · ${state.items.length.toLocaleString()} items indexed</span>
          </div>
        </div>

        <div class="stats" style="margin-top:16px">
          <div class="stat-box">
            <div class="val" id="stat-lines">0</div>
            <div class="lbl">Lines</div>
          </div>
          <div class="stat-box">
            <div class="val" id="stat-qty">0</div>
            <div class="lbl">Total Qty</div>
          </div>
          <div class="stat-box accent">
            <div class="val" id="stat-total">$0.00</div>
            <div class="lbl">Total</div>
          </div>
        </div>

        <div class="cart-wrap" id="cart-wrap">
          <div class="empty-cart">
            <div class="big">⚡</div>
            <div class="main-text">Ready for your first scan</div>
            <div class="sub-text">Items will flash in as they're added</div>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="pos-panel">
        <div class="panel-title"><span class="dot"></span> Sale Details</div>

        <div class="form-row">
          <div class="form-field">
            <label>Issue Date</label>
            <input type="date" id="issue-date" value="${todayISO()}" />
          </div>
          <div class="form-field">
            <label>Reference (auto)</label>
            <div id="ref-display"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field full suggest-wrap">
            <label>Customer</label>
            <input type="text" id="cust-search"
                   placeholder="Type to change customer…"
                   autocomplete="off" />
            <div class="suggest-list" id="cust-suggest"></div>
            <div class="customer-display" id="cust-selected"></div>
          </div>
        </div>

        <div class="divider-label">Walk-in customer info (saved in description)</div>
        <div class="form-row">
          <div class="form-field">
            <label>Name</label>
            <input type="text" id="cust-name-free" placeholder="Optional" />
          </div>
          <div class="form-field">
            <label>Phone</label>
            <input type="tel" id="cust-phone" placeholder="Optional" />
          </div>
        </div>

        <div class="summary" id="summary">
          <div class="summary-row"><span>Items</span><span id="sum-lines">0</span></div>
          <div class="summary-row"><span>Total Quantity</span><span id="sum-qty">0</span></div>
          <div class="summary-row total"><span>Total</span><span id="sum-total">0.00</span></div>
        </div>

        <div class="actions">
          <button class="btn btn-secondary" onclick="clearCart()">Clear</button>
          <button class="btn btn-primary" id="submit-btn" onclick="submitSale()">Complete Sale</button>
        </div>
      </div>
    </div>
  `;

  // ── Item search with dropdown ─────────────────────────────────────────
  const barcodeEl   = document.getElementById('barcode');
  const itemSuggest = document.getElementById('item-suggest');
  let itemActiveIdx = -1;
  let itemMatches   = [];

  function closeItemSuggest() {
    itemSuggest.classList.remove('open');
    itemActiveIdx = -1;
    itemMatches   = [];
  }

  function renderItemSuggest(q) {
    if (!q) { closeItemSuggest(); return; }
    const needle = q.toLowerCase();
    // Exact code match first, then startsWith code, then name contains
    const exact   = state.items.filter(r => (r.item?.itemCode || '').toLowerCase() === needle);
    const codeStart = state.items.filter(r => {
      const c = (r.item?.itemCode || '').toLowerCase();
      return c !== needle && c.startsWith(needle);
    });
    const nameHit = state.items.filter(r => {
      const n = (r.item?.itemName || '').toLowerCase();
      const c = (r.item?.itemCode || '').toLowerCase();
      return !c.startsWith(needle) && n.includes(needle);
    });
    itemMatches = [...exact, ...codeStart, ...nameHit].slice(0, 12);

    if (itemMatches.length === 0) { closeItemSuggest(); return; }

    itemSuggest.innerHTML = itemMatches.map((r, i) => {
      const code  = r.item?.itemCode  || '';
      const name  = r.item?.itemName  || '';
      const owned = (state.qtyOwned && r.key in state.qtyOwned)
        ? state.qtyOwned[r.key].toLocaleString(undefined, {maximumFractionDigits:2})
        : '—';
      const isLow = (state.qtyOwned && r.key in state.qtyOwned && state.qtyOwned[r.key] <= 0);
      return `<div class="suggest-item ${isLow ? 'suggest-item-low' : ''}" data-idx="${i}">
        <span class="si-code">${code}</span>
        <span class="si-name">${name}</span>
        <span class="si-stock" title="Stock on hand">${owned}</span>
      </div>`;
    }).join('');
    itemSuggest.classList.add('open');
    itemActiveIdx = -1;

    itemSuggest.querySelectorAll('.suggest-item').forEach((el, idx) => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const rec = itemMatches[idx];
        addItemToCartByRecord(rec);
        barcodeEl.value = '';
        closeItemSuggest();
        barcodeEl.focus();
      });
    });
  }

  barcodeEl.addEventListener('input', () => {
    renderItemSuggest(barcodeEl.value.trim());
  });

  barcodeEl.addEventListener('keydown', (e) => {
    if (itemSuggest.classList.contains('open')) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        itemActiveIdx = Math.min(itemActiveIdx + 1, itemMatches.length - 1);
        itemSuggest.querySelectorAll('.suggest-item').forEach((el, i) =>
          el.classList.toggle('active', i === itemActiveIdx));
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        itemActiveIdx = Math.max(itemActiveIdx - 1, 0);
        itemSuggest.querySelectorAll('.suggest-item').forEach((el, i) =>
          el.classList.toggle('active', i === itemActiveIdx));
        return;
      }
      if (e.key === 'Escape') { closeItemSuggest(); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (itemActiveIdx >= 0 && itemMatches[itemActiveIdx]) {
          addItemToCartByRecord(itemMatches[itemActiveIdx]);
          barcodeEl.value = '';
          closeItemSuggest();
        } else {
          // No selection — try exact barcode match (scanner path)
          const val = barcodeEl.value.trim();
          if (val && addItemToCart(val)) {
            barcodeEl.value = '';
            closeItemSuggest();
          }
        }
        return;
      }
    } else {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = barcodeEl.value.trim();
        if (val && addItemToCart(val)) {
          barcodeEl.value = '';
        }
      }
    }
  });

  barcodeEl.addEventListener('blur', () => {
    setTimeout(closeItemSuggest, 150);
  });

  // Customer search
  const custSearch = document.getElementById('cust-search');
  const custSuggest = document.getElementById('cust-suggest');
  let activeIdx = -1;

  custSearch.addEventListener('input', () => {
    const q = custSearch.value.trim().toLowerCase();
    if (!q) {
      custSuggest.classList.remove('open');
      return;
    }
    const matches = state.customers
      .filter(c => {
        const name = (c.item?.name || '').toLowerCase();
        const code = (c.item?.code || '').toLowerCase();
        return name.includes(q) || code.includes(q);
      })
      .slice(0, 8);

    if (matches.length === 0) {
      custSuggest.classList.remove('open');
      return;
    }
    activeIdx = -1;
    custSuggest.innerHTML = matches.map((c) => `
      <div class="suggest-item"
           data-key="${c.key}"
           data-name="${(c.item?.name || '').replace(/"/g,'&quot;')}"
           data-code="${(c.item?.code || '').replace(/"/g,'&quot;')}">
        <div class="name">${c.item?.name || 'Unnamed'}</div>
        <div class="code">${c.item?.code || 'no code'}</div>
      </div>
    `).join('');
    custSuggest.classList.add('open');
    custSuggest.querySelectorAll('.suggest-item').forEach(el => {
      el.addEventListener('click', () => {
        state.selectedCustomer = {
          key: el.dataset.key,
          name: el.dataset.name,
          code: el.dataset.code,
        };
        custSearch.value = '';
        custSuggest.classList.remove('open');
        renderCustomerField();
      });
    });
  });

  custSearch.addEventListener('keydown', (e) => {
    const items = custSuggest.querySelectorAll('.suggest-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    } else if (e.key === 'Enter' && activeIdx >= 0) {
      e.preventDefault();
      items[activeIdx].click();
    } else if (e.key === 'Escape') {
      custSuggest.classList.remove('open');
    }
  });

  document.addEventListener('click', (e) => {
    if (!custSearch.contains(e.target) && !custSuggest.contains(e.target)) {
      custSuggest.classList.remove('open');
    }
  });

  renderCustomerField();
  renderReference();
  renderCart();

  setTimeout(() => barcodeEl.focus(), 100);
}

function renderReference() {
  const el = document.getElementById('ref-display');
  if (!el) return;
  el.innerHTML = `<div class="ref-chip">🎫 ${state.reference}</div>`;
}

function renderCart() {
  const wrap = document.getElementById('cart-wrap');
  if (!wrap) return;

  if (state.cart.length === 0) {
    wrap.innerHTML = `
      <div class="empty-cart">
        <div class="big">⚡</div>
        <div class="main-text">Ready for your first scan</div>
        <div class="sub-text">Items will flash in as they're added</div>
      </div>
    `;
  } else {
    wrap.innerHTML = `
      <table class="cart-table">
        <thead>
          <tr>
            <th style="width:90px">Code</th>
            <th>Item</th>
            <th style="width:80px;text-align:right">Owned</th>
            <th style="width:90px;text-align:right">Qty</th>
            <th style="width:110px;text-align:right">Price</th>
            <th style="width:110px;text-align:right">Total</th>
            <th style="width:54px"></th>
          </tr>
        </thead>
        <tbody>
          ${state.cart.map(l => {
            const lineTotal = (Number(l.qty) || 0) * (Number(l.unitPrice) || 0);
            const qtyOwned = l.qtyOwned;
            const qtySold  = Number(l.qty) || 0;
            const isOver   = qtyOwned !== null && qtySold > qtyOwned;
            const isWarn   = qtyOwned !== null && qtySold === qtyOwned;
            let ownedClass = 'qty-owned-na', ownedLabel = '—';
            if (qtyOwned !== null) {
              ownedLabel = qtyOwned.toLocaleString(undefined, {maximumFractionDigits: 2});
              if (isOver)       ownedClass = 'qty-owned-over';
              else if (isWarn)  ownedClass = 'qty-owned-warn';
              else              ownedClass = 'qty-owned-ok';
            }
            const overCls  = isOver ? ' qty-over-row' : '';
            const newCls = l.isNew ? `class="new-row${overCls}"` : (overCls ? `class="${overCls.trim()}"` : '');
            l.isNew = false;
            return `
              <tr ${newCls} data-key="${l.key}">
                <td style="color:var(--slate-500);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600">${l.itemCode || '—'}</td>
                <td style="font-weight:600;color:var(--slate-900)">${l.itemName}</td>
                <td class="qty-owned-cell ${ownedClass}" title="Quantity currently in stock">${ownedLabel}</td>
                <td style="text-align:right">
                  <input type="number" class="qty-input" value="${l.qty}" min="0" step="any"
                         onchange="updateCartQty('${l.key}', this.value)" />
                </td>
                <td style="text-align:right">
                  <input type="number" class="price-input" value="${l.unitPrice}" readonly
                         title="Selling price is fixed and cannot be changed" />
                </td>
                <td class="line-total" style="text-align:right">${fmt(lineTotal)}</td>
                <td style="text-align:center">
                  <button class="remove-btn" onclick="removeFromCart('${l.key}')">×</button>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;
  }
  renderSummary();
}

function renderSummary() {
  const lines = state.cart.length;
  const qty = cartQty();
  const total = cartTotal();

  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('stat-lines', lines);
  set('stat-qty', qty.toLocaleString());
  set('stat-total', fmt(total));
  set('sum-lines', lines);
  set('sum-qty', qty.toLocaleString());
  set('sum-total', fmt(total));
}

function renderCustomerField() {
  const el = document.getElementById('cust-selected');
  if (!el) return;
  if (state.selectedCustomer) {
    el.innerHTML = `
      <span class="customer-badge">
        <span class="dot"></span>
        ${state.selectedCustomer.code || ''} · ${state.selectedCustomer.name}
      </span>
      <a class="clear-link" href="#" onclick="event.preventDefault();resetToDefaultCustomer()">reset to default</a>
    `;
  } else {
    el.innerHTML = `<span style="color:var(--rose);font-size:12px;font-weight:500">⚠ No customer with code "999" or "POS" found — please create one in Manager</span>`;
  }
}

function resetToDefaultCustomer() {
  const def = getDefaultCustomer();
  state.selectedCustomer = def ? {
    key: def.key,
    name: def.item?.name || 'POS',
    code: def.item?.code || '999',
  } : null;
  const search = document.getElementById('cust-search');
  if (search) search.value = '';
  renderCustomerField();
}

/* ═══════════════════════════════════════════
   THEME TOGGLE
═══════════════════════════════════════════ */
function toggleTheme() {
  const html = document.documentElement;
  const going = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = going;
  document.getElementById('theme-btn').textContent = going === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('pos-theme', going); } catch(e) {}
}

// Restore saved theme on load
(function() {
  try {
    const saved = localStorage.getItem('pos-theme');
    if (saved && saved !== 'dark') {
      document.documentElement.dataset.theme = saved;
      const btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = '☀️';
    }
  } catch(e) {}
})();
</script>
</body>
</html>
